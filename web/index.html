          ctx.arc(cx, cy, SPLASH_R * k, rot + i * st, rot + (i + 1) * st); ctx.closePath();
          ctx.fillStyle = rgba(PALETTE[i], a * closed); ctx.fill();
        }
      }
    }
    for (let i = 0; i < n; i++) {
      const d = clamp((t - i * 0.05) / 0.6, 0, 1), e = backOut(d), mid = rot + (i + 0.5) * st;
      const off = (1 - e) * 460, px = cx + Math.cos(mid + 1.2) * off, py = cy + Math.sin(mid + 1.2) * off;
      splashPiece(px, py, rot + i * st, rot + (i + 1) * st, SPLASH_R * (0.4 + 0.6 * e), PALETTE[i], clamp(d * 3, 0, 1));
    }
    if (closed > 0) {
      ctx.globalAlpha = closed;
      ctx.strokeStyle = 'rgba(13,13,23,0.55)'; ctx.lineWidth = 3;
      for (let i = 0; i < n; i++) {
        const a = rot + i * st;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * SPLASH_R, cy + Math.sin(a) * SPLASH_R); ctx.stroke();
      }
      circle(cx, cy, 22, 'rgb(18,18,26)');
      ctx.beginPath(); ctx.arc(cx, cy, 22, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // COLOR, one letter at a time in its color, then SPIN.
    const size = 100, word = 'COLOR', ty = cy + SPLASH_R + 150;
    ctx.font = `800 ${size}px ${FONT}`;
    const widths = [...word].map(ch => ctx.measureText(ch).width);
    let x = (W - widths.reduce((a, b) => a + b, 0)) / 2;
    for (let i = 0; i < word.length; i++) {
      const d = clamp((t - 1.0 - i * 0.08) / 0.35, 0, 1);
      if (d > 0) text(x, ty - (1 - backOut(d)) * 70, word[i], size, PALETTE[i], clamp(d * 2, 0, 1));
      x += widths[i];
    }
    const sp = clamp((t - 1.45) / 0.35, 0, 1);
    if (sp > 0) centered('SPIN', ty + 96 + (1 - easeOut(sp)) * 24, size, WHITE, sp);

    // The signature: who made it, underlined by the game's colors.
    const by = clamp((t - 1.8) / 0.4, 0, 1), name = clamp((t - 1.95) / 0.45, 0, 1), line = easeOut(clamp((t - 2.1) / 0.5, 0, 1));
    const sy = H - 170;
    if (by > 0) centered(tr('splash_by'), sy - 48, 22, WHITE, 0.55 * by);
    if (name > 0) {
      if ('letterSpacing' in ctx) ctx.letterSpacing = `${Math.round(8 * (1 - easeOut(name)) + 2)}px`;
      centered('DAVIDE DEX ESPERTINI', sy + (1 - easeOut(name)) * 14, 36, WHITE, name);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    }
    if (line > 0) {
      const w = 440 * line, g = ctx.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0);
      [0, 2, 3, 1, 4].forEach((c, k) => g.addColorStop(k / 4, rgba(PALETTE[c])));
      ctx.fillStyle = g; roundRect({ x: W / 2 - w / 2, y: sy + 22, w, h: 5 }, 2.5); ctx.fill();
    }
    // Into the menu.
    const out = clamp((t - (SPLASH_TIME - 0.4)) / 0.4, 0, 1);
    if (out > 0) { ctx.fillStyle = rgba(BG_BOTTOM, out); ctx.fillRect(0, 0, W, H); }
  }

  // Under the pause button: how far ahead (green) or behind (red) the ghost you are.
  function drawGhost() {
    const o = social.duel.owner, gh = o.ghost, name = (o.name || tr('player')).toUpperCase();
    const ended = playTime >= gh.length, g = ended ? o.score : gh[Math.floor(playTime)] ?? 0, d = score - g;
    const c = d > 0 ? PALETTE[3] : d < 0 ? PALETTE[0] : WHITE, y = 132;
    ctx.font = `800 34px ${FONT}`;
    const label = String(Math.abs(d)), w = ctx.measureText(label).width, x = W / 2 - (w + 26) / 2;
    if (d) {
      ctx.beginPath(); ctx.fillStyle = rgba(c);
      if (d > 0) { ctx.moveTo(x, y - 6); ctx.lineTo(x + 18, y - 6); ctx.lineTo(x + 9, y - 24); }
      else { ctx.moveTo(x, y - 24); ctx.lineTo(x + 18, y - 24); ctx.lineTo(x + 9, y - 6); }
      ctx.fill();
    }
    text(x + 26, y, label, 34, c);
    centered(ended ? tr('duel_finished', name, o.score) : `${name}  ${g}`, y + 28, 16, WHITE, 0.55);
    iconText('duel', W - 24, 104, tr('duel_title'), 18, hex(MODE_COLORS.duel), 0.85, 'right');
  }

  // "COMBO 37 LOST", its letters falling apart.
  function drawComboLost() {
    const t = comboLost.t / 1.4, str = tr('combo_lost', comboLost.n), size = 40, y0 = H * 0.36;
    ctx.font = `800 ${size}px ${FONT}`;
    let x = (W - ctx.measureText(str).width) / 2;
    [...str].forEach((ch, i) => {
      const w = ctx.measureText(ch).width, r = fposmod(Math.sin(i * 12.9898) * 43758.5453, 1), fall = (1 - t) ** 2;
      ctx.save();
      ctx.translate(x + w / 2 + (r - 0.5) * 80 * fall, y0 + fall * (120 + 160 * r));
      ctx.rotate((r - 0.5) * 1.6 * fall);
      ctx.globalAlpha = clamp(t * 1.6, 0, 1);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = rgba(PALETTE[0]); ctx.fillText(ch, 0, 0);
      ctx.restore();
      x += w;
    });
    ctx.globalAlpha = 1;
  }

  // A mode's icon, `size` wide, centered on x, y.
  function drawModeIcon(m, x, y, size, color) {
    ctx.save();
    ctx.translate(x - size / 2, y - size / 2); ctx.scale(size / 24, size / 24);
    ctx.fillStyle = ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.lineCap = ctx.lineJoin = 'round';
    for (const [how, d] of MODE_ICONS[m]) { const path = new Path2D(d); if (how === 'fill') ctx.fill(path); else ctx.stroke(path); }
    ctx.restore();
  }
  // Text with a mode's icon before it; align 'center' or 'right' (at x).
  function iconText(m, x, y, str, size, color, alpha = 1, align = 'center') {
    ctx.font = `800 ${Math.round(size)}px ${FONT}`;
    const icon = size * 1.3, gap = size * 0.4, w = ctx.measureText(str).width;
    const left = align === 'right' ? x - w - gap - icon : x - (icon + gap + w) / 2;
    ctx.globalAlpha = alpha;
    drawModeIcon(m, left + icon / 2, y - size * 0.36, icon, rgba(color));
    ctx.globalAlpha = 1;
    text(left + icon + gap, y, str, size, color, alpha);
  }
  // A button with a small second line under its label, and a mode icon before that line.
  function button2(r, label, sub, bg, fg, icon) {
    roundRect(r, r.h / 2);
    ctx.save(); ctx.shadowColor = rgba(bg, 0.35); ctx.shadowBlur = 28; ctx.fillStyle = rgba(bg); ctx.fill(); ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = rgba(fg);
    const fit = (str, size, room) => {
      let fs = size;
      ctx.font = `800 ${fs}px ${FONT}`;
      while (fs > 12 && ctx.measureText(str).width > room) ctx.font = `800 ${--fs}px ${FONT}`;
      return fs;
    };
    const cx = r.x + r.w / 2;
    fit(label, Math.round(r.h * 0.34), r.w - 40);
    ctx.fillText(label, cx, r.y + r.h * 0.4);
    const y = r.y + r.h * 0.74, fs = fit(sub, Math.round(r.h * 0.17), r.w - 40 - (icon ? r.h * 0.3 : 0));
    ctx.globalAlpha = 0.7;
    if (icon) {
      const size = fs * 1.5, gap = fs * 0.45, left = cx - (size + gap + ctx.measureText(sub).width) / 2;
      drawModeIcon(icon, left + size / 2, y, size, rgba(fg));
      ctx.textAlign = 'left'; ctx.fillText(sub, left + size + gap, y);
    } else ctx.fillText(sub, cx, y);
    ctx.globalAlpha = 1;
  }
  // A left or right chevron in a soft circle.
  function drawChevron(r, dir, flash) {
    const cx = r.x + r.w / 2 + dir * 6 * flash, cy = r.y + r.h / 2;
    circle(cx, cy, 34, `rgba(255,255,255,${0.08 + 0.15 * flash})`);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cx - dir * 6, cy - 13); ctx.lineTo(cx + dir * 7, cy); ctx.lineTo(cx - dir * 6, cy + 13); ctx.stroke();
  }
  // A medal on a ribbon; a dot on it while an award is new.
  function drawMedalIcon(r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 4, col = 'rgba(255,255,255,0.75)';
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 9, cy - 20); ctx.lineTo(cx - 3, cy - 8); ctx.moveTo(cx + 9, cy - 20); ctx.lineTo(cx + 3, cy - 8); ctx.stroke();
    circle(cx, cy + 3, 12, col);
    drawSymbol('star', cx, cy + 3, 8, rgba(BG_TOP));
  }
  // Two people; a red dot when a friend beat you or played your duel.
  function drawFriendsIcon(r, dot) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, col = 'rgba(255,255,255,0.75)';
    circle(cx - 8, cy - 7, 6.5, col); circle(cx + 9, cy - 9, 5.5, 'rgba(255,255,255,0.5)');

  // Curved arrow; dir 1 = clockwise, -1 = counter-clockwise (mirrored).
  function drawTurnArrow(cx, cy, dir, alpha) {
    const r = 34, a0 = -Math.PI * 0.85, a1 = Math.PI * 0.35;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(dir, 1);
    ctx.strokeStyle = ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.stroke();
    const tip = [Math.cos(a1) * r, Math.sin(a1) * r], tg = [-Math.sin(a1), Math.cos(a1)], sd = [-tg[1], tg[0]];
    ctx.beginPath();
    ctx.moveTo(tip[0] + tg[0] * 14, tip[1] + tg[1] * 14);
    ctx.lineTo(tip[0] - tg[0] * 4 + sd[0] * 12, tip[1] - tg[1] * 4 + sd[1] * 12);
    ctx.lineTo(tip[0] - tg[0] * 4 - sd[0] * 12, tip[1] - tg[1] * 4 - sd[1] * 12);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  }

  // The daily and 60-second boards: a subtitle, then the same rows.
  function drawRemoteBoard(rb, subtitle, empty) {
    centered(subtitle, H * 0.1 + 124, 20, rb === daily ? PALETTE[4] : WHITE, rb === daily ? 0.9 : 0.5);
    const y0 = H * 0.21;
    if (rb.status === 'offline' && !rb.rows.length) centered(tr('offline'), H * 0.4, 24, WHITE, 0.6);
    else if (rb.status !== 'ok') centered(tr('loading'), H * 0.4, 24, WHITE, 0.6);
    else if (!rb.rows.length) centered(empty, H * 0.4, 24, WHITE, 0.6);
    const global = rb.source === 'server';
    rb.rows.forEach((r, i) => boardRow(y0 + i * 66, i + 1, r, r.mine, false, global));
    if (global && rb.me && rb.me.rank > rb.rows.length) {
      const y = y0 + rb.rows.length * 66 + 10;
      centered('···', y + 4, 24, WHITE, 0.4);
      boardRow(y + 20, rb.me.rank, rb.me, true, false, true);
    }
    drawReport();
    centered(tr('tap_back'), H * 0.9, 22, WHITE, 0.5);
  }

  function boardRow(y, rank, r, mine, local, global) {
    const w = W - 80;
    ctx.fillStyle = mine ? rgba(PALETTE[2], 0.16) : 'rgba(255,255,255,0.05)';
    roundRect({ x: 40, y, w, h: 56 }, 14); ctx.fill();
    circle(76, y + 28, 18, rgba(PALETTE[(rank - 1) % PALETTE.length]));
    ctx.font = `800 ${rank < 100 ? 22 : rank < 1000 ? 16 : 12}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(INK); ctx.fillText(String(rank), 76, y + 29);
    // Local games saved before names existed, or left unnamed, show their date.
    let name = local ? r.name || r.date : (global ? r.name : board.names[r.id]) || tr('player');
    if (mine && !local) name += tr('you');
    ctx.font = `800 24px ${FONT}`;
    while (name.length > 3 && ctx.measureText(name).width > w - 250) name = name.slice(0, -2) + '…';
    text(112, y + 37, name, 24, WHITE);
    text(40 + w - 120, y + 36, tr('row_level', r.level), 18, WHITE, 0.45, 'right');
    text(40 + w - 22, y + 39, String(r.score), 30, WHITE, 1, 'right');
  }

  function drawAbout() {
    ctx.fillStyle = rgba(BG_BOTTOM, 0.85); ctx.fillRect(0, 0, W, H);
    // The text scrolls above the fixed "tap to go back" line.
    const bottom = pageBottom();
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, bottom); ctx.clip();
    ctx.translate(0, -pageScroll);
    centered('COLOR SPIN', H * 0.1, 60, WHITE);
    centered(tr('version', VERSION), H * 0.1 + 40, 20, WHITE, 0.5);
    let y = H * 0.18;
    for (const [title, lines] of TEXT[lang].about) {
      centered(title, y, 26, PALETTE[2]);
      y += 40;
      for (const line of lines) { centered(line, y, 22, WHITE, 0.8); y += 31; }
      y += 22;
    }
    // The site link, right under the credits: underlined, and tappable.
    y -= 22;
    ctx.font = `800 24px ${FONT}`;
    const w = ctx.measureText(SITE_LABEL).width;
    centered(SITE_LABEL, y, 24, PALETTE[1]);
    ctx.fillStyle = rgba(PALETTE[1]); ctx.fillRect((W - w) / 2, y + 5, w, 2);
    ctx.restore();
    pageMax = Math.max(0, y + 60 - bottom);
    pageScroll = Math.min(pageScroll, pageMax);
    // Tappable only while on screen.
    const ly = y - pageScroll;
    linkRect = ly < bottom ? { x: (W - w) / 2 - 20, y: ly - 34, w: w + 40, h: Math.min(56, bottom - ly + 34) } : { x: 0, y: 0, w: 0, h: 0 };
    // More text below: fade the bottom edge.
    if (pageScroll < pageMax - 1) {
      const g = ctx.createLinearGradient(0, bottom - 90, 0, bottom);
      g.addColorStop(0, rgba(BG_BOTTOM, 0)); g.addColorStop(1, rgba(BG_BOTTOM, 0.95));
      ctx.fillStyle = g; ctx.fillRect(0, bottom - 90, W, 90);
    }
    centered(tr('tap_back'), H * 0.9, 22, WHITE, 0.5);
  }

  function drawSettings() {
    ctx.fillStyle = rgba(BG_BOTTOM, 0.85); ctx.fillRect(0, 0, W, H);
    centered(tr('settings'), H * 0.13, 60, WHITE);
    const rows = settingsButtons();
    const values = [
      [tr('music'), music.muted ? tr('off') : tr('on')],
      [tr('sounds'), sfx.muted ? tr('off') : tr('on')],
      [tr('language'), tr('lang_name')],
      [tr('vibration'), vibrateOn ? tr('on') : tr('off')],
      [tr('symbols'), symbolsOn ? tr('on') : tr('off')],
    ];
    values.forEach(([k, v], i) => button(rows[i], `${k}:  ${v}`, WHITE, 0.1, WHITE));
    // A preview of the symbols next to their row.
    if (symbolsOn) SYMBOLS.forEach((k, i) => {
      const x = W / 2 - 3.5 * 40 + i * 40, y = rows[4].y + rows[4].h + 28;
      circle(x, y, 15, rgba(PALETTE[i])); drawSymbol(k, x, y, 10, rgba(INK, 0.85));
    });
    if (socialOn()) button(rows[5], tr('recovery'), WHITE, 0.1, WHITE);
    button(rows[6], tr('back'), PALETTE[2], 1, INK);
  }

  function drawPlay() {
    const m = multiplier();
    if (m > 1 && (state === STATE.PLAYING || state === STATE.PAUSED)) {
      // The edges of the screen glow in the multiplier's color; x4 runs through the palette.
      const c = m >= 4 ? PALETTE[Math.floor(time * 6) % PALETTE.length] : hex(COMBO_COLORS[m]);
      const a = [0, 0, 0.13, 0.19, 0.26][m] * (reducedMotion ? 1 : 0.8 + 0.2 * Math.sin(time * 5));
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.hypot(W, H) * 0.56);
      g.addColorStop(0, rgba(c, 0)); g.addColorStop(1, rgba(c, a));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (milestone && state === STATE.PLAYING) {
      const t = milestone.t, grow = 1 + 0.4 * easeOut(1 - t);
      centered(`${milestone.n}!`, worldY - 250, 96 * grow, PALETTE[2], clamp(t * 2, 0, 1));
    }
    if (comboLost && state === STATE.PLAYING) drawComboLost();
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = rgba(PALETTE[2]);
    ctx.fillRect(0, 0, W * (hits % POINTS_PER_LEVEL) / POINTS_PER_LEVEL, 6);

    text(28, 84, String(score), 56 + 18 * scorePop, WHITE);
    const scoreW = ctx.measureText(String(score)).width;
    const mult = multiplier();
    if (mult > 1) text(28 + scoreW + 14, 84, `x${mult}`, 36 + 16 * comboPop, PALETTE[2]);
    text(30, 118, tr('hud_level', level), 20, WHITE, 0.55);
    if (streak >= 3) text(30, 146, tr('hud_combo', streak), 18, PALETTE[2], 0.7);
    if (mode === 'daily') text(W - 24, 104, tr('daily', dayNumber(gameDay)), 18, PALETTE[4], 0.85, 'right');
    if (mode === 'zen') iconText('zen', W - 28, 72, tr('mode_zen'), 26, hex(MODE_COLORS.zen), 0.7, 'right');
    if (mode === 'hardcore') iconText('hardcore', W - 24, 104, tr('mode_hardcore'), 18, hex(MODE_COLORS.hardcore), 0.85, 'right');
    if (mode === 'duel' && social.duel) drawGhost();
    if (mode === 'sprint') {
      // Time left, red in the last 10 seconds, with a bar under it.
      const secs = Math.ceil(clock), low = clock < 10;
      const pop = low && state === STATE.PLAYING ? 1 + 0.08 * Math.max(0, Math.cos((clock % 1) * TAU)) : 1;
      text(W - 28, 84, `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, 52 * pop, low ? PALETTE[0] : WHITE, 1, 'right');
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(W - 188, 100, 160, 6);
      ctx.fillStyle = rgba(low ? PALETTE[0] : PALETTE[6]); ctx.fillRect(W - 188, 100, 160 * clamp(clock / SPRINT_TIME, 0, 1), 6);
    }
    if (slowTime > 0) {
      // Time left in slow motion, as an arc around the shape.
      ctx.beginPath();
      ctx.arc(worldX, worldY, 200, -Math.PI / 2, -Math.PI / 2 + TAU * slowTime / SLOW_TIME);
      ctx.strokeStyle = rgba(PALETTE[6], 0.8); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
    }
    for (let i = 0; hasLives() && i < maxLives; i++) {
      const x = W - 36 - i * 34, y = 56;
      if (i < lives) {
        circle(x, y, 17, rgba(PALETTE[0], 0.2));
        circle(x, y, 11, rgba(PALETTE[0]));
        circle(x - 3, y - 3, 3.5, 'rgba(255,255,255,0.5)');
      } else {
        ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    if (state === STATE.PLAYING) {
      drawPauseIcon(pauseButton());
      drawTurnArrow(96, H - 110, -1, 0.12 + 0.6 * arrowFlash[0]);
      drawTurnArrow(W - 96, H - 110, 1, 0.12 + 0.6 * arrowFlash[1]);
    }
    if (bannerTime > 0 && state === STATE.PLAYING) {
      const a = clamp(bannerTime / 0.4, 0, 1), grow = clamp((1.2 - bannerTime) / 0.15, 0, 1);
      centered(banner, H * 0.22, lerp(36, 52, grow), WHITE, a);
    }
    if (hint && state === STATE.PLAYING) {
      const a = clamp(hint.time / 0.4, 0, 1) * clamp((3.5 - hint.time) / 0.2, 0, 1);
      centered(hint.title, H * 0.3, 34, PALETTE[2], a);
      centered(hint.line, H * 0.3 + 38, 22, WHITE, 0.85 * a);
    }
  }

  function drawPause() {
    if (resumeTimer > 0) {
      // Countdown over the frozen board, so the player can see what's coming.
      const n = Math.ceil(resumeTimer / RESUME_BEAT), k = (resumeTimer % RESUME_BEAT) / RESUME_BEAT;
      ctx.fillStyle = rgba(BG_BOTTOM, 0.35); ctx.fillRect(0, 0, W, H);
      centered(String(n), H * 0.22 + 20, lerp(90, 130, k), WHITE, clamp(k * 2, 0, 1));
      return;
    }
    const t = clamp(pauseTime * 5, 0, 1);
    ctx.fillStyle = rgba(BG_BOTTOM, 0.8 * t); ctx.fillRect(0, 0, W, H);
    const slide = (1 - t) * 30;
    centered(tr('paused'), H * 0.3 + slide, 68, WHITE, t);
    centered(tr('pause_stats', score, level), H * 0.3 + 48 + slide, 22, WHITE, 0.55 * t);
    const b = pauseButtons();
    button(b[0], tr('resume'), PALETTE[2], 1, INK);
    button(b[1], tr('menu'), WHITE, 0.1, WHITE);
    const audio = pauseAudioButtons();
    drawMusicIcon(audio[0]);
    drawSoundIcon(audio[1]);
  }

  function drawGameOver() {
    const t = clamp(gameOverTime * 3, 0, 1);
    ctx.fillStyle = rgba(BG_BOTTOM, 0.8 * t); ctx.fillRect(0, 0, W, H);
    const slide = (1 - t) * 40;
    if (mode === 'duel' && social.duel) {
      // The verdict against the duel's owner.
      const o = social.duel.owner, name = (o.name || tr('player')).toUpperCase();
      const res = score > o.score ? 'win' : score < o.score ? 'lose' : 'draw';
      iconText('duel', W / 2, H * 0.27 - 76 + slide, tr('duel_title'), 24, hex(MODE_COLORS.duel), t);
      centered(tr(`duel_${res}`), H * 0.27 + slide, 68, res === 'win' ? PALETTE[3] : res === 'lose' ? PALETTE[0] : PALETTE[2], t);
      centered(String(score), H * 0.41 + slide, 130, WHITE, t);
      centered(tr('duel_score', score, name, o.score), H * 0.41 + 50 + slide, 24, WHITE, 0.7 * t);
      drawGameOverButtons();
      return;
    }
    if (mode === 'daily') centered(`${tr('daily', dayNumber(gameDay))}  ·  ${twistText(twist)[0]}`, H * 0.27 - 76 + slide, 24, PALETTE[4], t);
    if (mode === 'sprint' || mode === 'hardcore') iconText(mode, W / 2, H * 0.27 - 76 + slide, tr(`mode_${mode}`), 24, hex(MODE_COLORS[mode]), t);
    centered(tr(mode === 'sprint' ? 'time_up' : 'game_over'), H * 0.27 + slide, 68, PALETTE[0], t);
    centered(String(score), H * 0.41 + slide, 130, WHITE, t);
    centered(tr('points_level', level, bestStreak), H * 0.41 + 44 + slide, 22, WHITE, 0.55 * t);
    const daySide = mode === 'daily';
    if (newBest) centered(tr(daySide ? 'daily_new_best' : 'new_best'), H * 0.52 + slide, 34 + Math.sin(time * 6) * 3, PALETTE[2], t);
    else centered(daySide ? tr('daily_best', todayBest()) : tr('best', records[mode] ?? best), H * 0.52 + slide, 26, WHITE, 0.6 * t);
    const rb = modeBoard();
    if (rb) { if (rb.me) centered(rankText(rb), H * 0.52 + 44 + slide, 22, WHITE, 0.7 * t); }
    else if (lastRank > 0) centered(tr('rank', lastRank), H * 0.52 + 44 + slide, 22, WHITE, 0.7 * t);
    else if (score > 0 && board.status === 'ready' && !board.myId)
      centered(tr('sign_in'), H * 0.52 + 44 + slide, 20, WHITE, 0.5 * t);
    if (nameShown) placeNameInput(t);
    drawGameOverButtons();
  }
  function drawGameOverButtons() {
    if (gameOverTime <= 0.6) return;
    const look = { replay: [tr('replay'), PALETTE[2], 1, INK], share: [tr('share'), PALETTE[4], 1, INK],
      duel: [tr('duel'), hex(MODE_COLORS.duel), 1, INK], sendback: [tr('duel_send_back'), hex(MODE_COLORS.duel), 1, INK],
      menu: [tr('menu'), WHITE, 0.1, WHITE] };
    for (const r of gameOverButtons()) button(r, ...look[r.id]);
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    // A new multiplier kicks the board toward the player for a moment.
    const k = reducedMotion ? 0 : kick * kick;
    if (k > 0) { ctx.save(); ctx.translate(worldX, worldY); ctx.scale(1 + 0.04 * k, 1 + 0.04 * k); ctx.translate(-worldX, -worldY); }
    drawBackground();
    drawBalls();
    if (state === STATE.SPLASH) drawSplash();
    else shape.draw(worldX, worldY);
    drawFx(worldX, worldY);
    if (k > 0) ctx.restore();
    if (state === STATE.MENU) drawMenu();
    else if (state === STATE.LEADERBOARD) drawLeaderboard();
    else if (state === STATE.ABOUT) drawAbout();
    else if (state === STATE.SETTINGS) drawSettings();
    else if (state === STATE.AWARDS) drawAwards();
    else if (state === STATE.FRIENDS) drawFriends();
    else if (state === STATE.DUEL) drawDuel();
    else if (state === STATE.SPLASH) { /* drawn with the shape, above */ }
    else {
      drawPlay();
      if (state === STATE.PAUSED) drawPause();
      else if (state === STATE.GAME_OVER) drawGameOver();
    }
    if (toast) centered(toast.text, H * 0.95, 22, WHITE, clamp(toast.time / 0.4, 0, 1));
    if (awardQueue.length && (state === STATE.PLAYING || state === STATE.GAME_OVER)) {
      // A new award: a yellow pill sliding in under the top bar.
      const a = awardQueue[0], k = clamp(Math.min(a.time, AWARD_TIME - a.time) / 0.25, 0, 1);
      ctx.font = `800 24px ${FONT}`;
      const w = ctx.measureText(a.text).width + 90, r = { x: (W - w) / 2, y: 118 - 30 * (1 - k), w, h: 56 };
      ctx.globalAlpha = k;
      roundRect(r, 28); ctx.fillStyle = rgba(PALETTE[2]); ctx.fill();
      drawSymbol('star', r.x + 34, r.y + 28, 13, rgba(INK));
      ctx.fillStyle = rgba(INK); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(a.text, r.x + w / 2 + 18, r.y + 29);
      ctx.globalAlpha = 1;
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,51,51,${0.22 * flash})`; ctx.fillRect(0, 0, W, H); }
    if (comboFlash > 0 && !reducedMotion) { ctx.fillStyle = rgba(comboColor, 0.18 * comboFlash); ctx.fillRect(0, 0, W, H); }
    if (fade > 0) { ctx.fillStyle = rgba(BG_BOTTOM, fade); ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function frame(now) {
    // Clamp the step so a hidden tab or a hiccup doesn't teleport the balls.
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  applyLanguage();
  try { if (localStorage.getItem(RESTORED_KEY)) { localStorage.removeItem(RESTORED_KEY); showToast(tr('restored')); } } catch {}
  startSplash();
  requestAnimationFrame(frame);
  initBoard();
})();
</script>
