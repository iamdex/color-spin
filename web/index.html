<title>Color Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
<style>
  :root { color-scheme: dark; --bg: #08080f; box-sizing: border-box; height: 100%; background: var(--bg); }
  body { height: 100%; margin: 0; background: var(--bg); overflow: hidden;
         display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; -webkit-tap-highlight-color: transparent;
           user-select: none; -webkit-user-select: none; }
  canvas:focus { outline: none; }
  canvas:focus-visible { outline: 2px solid #ffd43b; outline-offset: -2px; }
  #name, #code { position: fixed; display: none; box-sizing: border-box; margin: 0; text-align: center;
          font-family: Montserrat, "Arial Black", Arial, sans-serif; font-weight: 800; color: #fff;
          background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.3);
          outline: none; caret-color: #ffd43b; }
  #name::placeholder, #code::placeholder { color: rgba(255,255,255,0.4); }
  #name:focus, #code:focus { border-color: #ffd43b; }
  #code { text-transform: uppercase; letter-spacing: 0.12em; }
</style>

<canvas id="game" tabindex="0"></canvas>
<input id="name" maxlength="14" autocomplete="nickname" enterkeyhint="done">
<input id="code" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">

  // --- Figure ---------------------------------------------------------------
  const shape = {

  const env = (t, attack, decay) => Math.min(t / attack, 1) * Math.exp(-t / decay);

    const out = new Float32Array(Math.floor((gap * (freqs.length - 1) + noteDur) * RATE));
    freqs.forEach((f, k) => {
      const note = blip(f, f, noteDur, decay, amp, harm), off = Math.floor(k * gap * RATE);
      for (let i = 0; i < note.length; i++) out[off + i] += note[i];
    });
    return out;
  }
  function toggleSound() {
    sfx.muted = !sfx.muted;
    try { localStorage.setItem(MUTE_KEY, sfx.muted ? '1' : '0'); } catch {}
    sfx.play('click');
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    canvas.setAttribute('aria-label', tr('aria'));
    nameInput.placeholder = tr('name_hint');
    nameInput.setAttribute('aria-label', tr('name_label'));
  }
  function toggleLanguage() {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
    applyLanguage();
    sfx.play('click');

  function toggleMusic() {
    music.muted = !music.muted;
    try { localStorage.setItem(MUSIC_KEY, music.muted ? '1' : '0'); } catch {}
    music.updateMaster();
    sfx.play('click');
  }

  // --- Music ----------------------------------------------------------------
  // Soft synth-pop in A minor / C major, same parts and numbers as music.gd.
  const STEPS_PER_BAR = 16, BARS = 4, MENU_BPM = 92, DUCKED = 0.3, OUT_GAIN = 0.5;
  const LAYER = { PAD: 0, BASS: 1, DRUMS: 2, ARP: 3, LEAD: 4, CLAP: 5 };
  // Am - F - C - G, one chord per bar (MIDI notes).
  const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];
  const ROOTS = [45, 41, 48, 43];
  const ARP_STEPS = [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 2, 1, 2, 1];
  // Lead melody over the 4 bars: step in the loop -> MIDI note.
  const LEAD = {
    0: 76, 4: 74, 6: 72, 8: 69, 12: 72, 14: 74,
    16: 72, 20: 69, 24: 72, 26: 74, 28: 76,
    32: 79, 36: 76, 38: 74, 40: 72, 44: 76, 46: 79,
    48: 74, 52: 76, 54: 74, 56: 74, 60: 71, 62: 74,
  };
  const midiFreq = m => 440 * 2 ** ((m - 69) / 12);
  const arpNote = (bar, s) => {
    const c = CHORDS[bar];
    return [c[0] + 12, c[1] + 12, c[2] + 12, c[0] + 24][ARP_STEPS[s]];
  };

  // A plucked or held note: harmonics[k] is the level of harmonic k + 1.
  function tone(f, dur, attack, decay, amp, harmonics) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n), inc = TAU * f / RATE;
    for (let i = 0; i < n; i++) {
      let v = 0;
      harmonics.forEach((h, k) => { v += h * Math.sin(inc * i * (k + 1)); });
      out[i] = v * amp * env(i / RATE, attack, decay);
    }
    return out;
  }
  // Soft chord pad: two slightly detuned oscillators for a chorus effect.
  function padChord(notes) {
    const n = Math.floor(2.8 * RATE), out = new Float32Array(n);
    for (const m of notes) {
      const i1 = TAU * midiFreq(m) / RATE, i2 = i1 * 1.004;
      for (let i = 0; i < n; i++) {
        const a = i1 * i, b = i2 * i;
        out[i] += (Math.sin(a) + 0.35 * Math.sin(2 * a) + Math.sin(b) + 0.15 * Math.sin(3 * b)) * 0.045 * env(i / RATE, 0.35, 1.6);
      }
    }
    return out;
  }
  // Lead voice with a gentle vibrato that fades in.
  function leadNote(f) {
    const n = Math.floor(0.7 * RATE), out = new Float32Array(n);
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / RATE;
      phase += TAU * f * (1 + 0.004 * Math.sin(TAU * 5.5 * t) * Math.min(t / 0.15, 1)) / RATE;
      out[i] = (Math.sin(phase) + 0.25 * Math.sin(2 * phase) + 0.1 * Math.sin(3 * phase)) * 0.14 * env(t, 0.01, 0.3);
    }
    return out;
  }
  function sweep(f0, f1, dur, decay, amp) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n);
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / RATE;
      phase += TAU * lerp(f0, f1, t / dur) / RATE;
      out[i] = Math.sin(phase) * amp * env(t, 0.003, decay);
    }
    return out;
  }
  // Noise burst; `bright` keeps only the highs (hi-hat) instead of the full band (clap).
  function noise(dur, decay, amp, bright) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n);
    let prev = 0;
    for (let i = 0; i < n; i++) {
      const x = rand(-1, 1);
      out[i] = (bright ? x - prev : x) * amp * env(i / RATE, 0.002, decay);
      prev = x;
    }
    return out;
  }

  const music = {
    muted: (() => { try { return localStorage.getItem(MUSIC_KEY) === '1'; } catch { return false; } })(),
    ctx: null, out: null, layers: [], targets: [0, 0, 0, 0, 0, 0], b: null,
    playing: false, ducked: false, bpm: MENU_BPM, step: 0, nextTime: 0,
    // Called once the audio context exists (after the first user gesture).
    init(ctx, buf) {
      this.ctx = ctx;
      this.out = ctx.createGain(); this.out.gain.value = 0; this.out.connect(ctx.destination);
      this.layers = this.targets.map(() => {
        const g = ctx.createGain(); g.gain.value = 0; g.connect(this.out); return g;
      });
      const b = this.b = { pad: CHORDS.map(c => buf(padChord(c))), bass: {}, arp: {}, lead: {} };
      for (const r of ROOTS) for (const m of [r, r + 12])
        b.bass[m] = buf(tone(midiFreq(m), 0.4, 0.005, 0.18, m === r ? 0.32 : 0.28, [1, 0.5, 0.25]));
      for (let bar = 0; bar < BARS; bar++) for (let s = 0; s < STEPS_PER_BAR; s++) {
        const m = arpNote(bar, s);
        b.arp[m] ||= buf(tone(midiFreq(m), 0.3, 0.002, 0.07, 0.1, [1, 0.3]));
      }
      for (const m of Object.values(LEAD)) b.lead[m] ||= buf(leadNote(midiFreq(m)));
      b.kick = buf(sweep(150, 45, 0.25, 0.12, 0.5));
      b.hat = buf(noise(0.05, 0.015, 0.07, true));
      b.clap = buf(noise(0.15, 0.05, 0.12, false));
      this.applyLayers(); this.updateMaster();
      this.nextTime = ctx.currentTime + 0.05;
      setInterval(() => this.tick(), 25);
    },
    // Calm version for the menu: pad, a little bass and the arpeggio.
    playMenu() { this.begin(); this.slow = false; this.bpm = MENU_BPM; this.setLayers([1, 0.6, 0, 0.7, 0, 0]); },
    // One more instrument with every new figure (tier), a bit faster every level.
    playGame(lvl, t) { this.begin(); this.slow = false; this.setLevel(lvl, t); },
    setLevel(lvl, t) {
      this.gameBpm = Math.min(100 + 2 * (lvl - 1), 128);
      this.bpm = this.gameBpm * (this.slow ? 0.75 : 1);
      this.setLayers([1, 1, t >= 1, t >= 2, t >= 3, t >= 4].map(Number));
    },
    setSlow(on) { this.slow = on; this.bpm = this.gameBpm * (on ? 0.75 : 1); },
    setDucked(on) { this.ducked = on; this.updateMaster(); },
    // Fades out; the next play* starts again from the first bar.
    stop() { this.playing = false; this.updateMaster(); },
    begin() {
      if (!this.playing) { this.step = 0; if (this.ctx) this.nextTime = this.ctx.currentTime + 0.05; }
      this.playing = true; this.ducked = false; this.updateMaster();
    },
    setLayers(t) { this.targets = t; this.applyLayers(); },
    applyLayers() {
      if (!this.ctx) return;
      this.layers.forEach((g, i) => g.gain.setTargetAtTime(this.targets[i], this.ctx.currentTime, 0.25));
    },
    updateMaster() {
      if (!this.ctx) return;
      const v = this.muted || !this.playing ? 0 : (this.ducked ? DUCKED : 1) * OUT_GAIN;
      this.out.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2);
    },
    // Look-ahead scheduler: queues the 16ths due in the next ~120 ms.
    tick() {
      const now = this.ctx.currentTime;
      if (!this.playing || this.muted || this.nextTime < now - 0.2) {
        // Silent, or the tab was frozen: don't try to catch up.
        this.nextTime = Math.max(this.nextTime, now + 0.05);
        if (!this.playing || this.muted) return;
      }
      while (this.nextTime < now + 0.12) {
        this.trigger(this.step, this.nextTime);
        this.step = (this.step + 1) % (STEPS_PER_BAR * BARS);
        this.nextTime += 60 / this.bpm / 4;
      }
    },
    trigger(step, when) {
      const bar = Math.floor(step / STEPS_PER_BAR), s = step % STEPS_PER_BAR, b = this.b;
      if (s === 0) this.voice(b.pad[bar], LAYER.PAD, when);
      if (s % 2 === 0) this.voice(b.bass[ROOTS[bar] + (s === 6 || s === 14 ? 12 : 0)], LAYER.BASS, when);
      if (s === 0 || s === 8) this.voice(b.kick, LAYER.DRUMS, when);
      if (s % 4 === 2) this.voice(b.hat, LAYER.DRUMS, when);
      if (s === 4 || s === 12) this.voice(b.clap, LAYER.CLAP, when);
      this.voice(b.arp[arpNote(bar, s)], LAYER.ARP, when);
      if (LEAD[step]) this.voice(b.lead[LEAD[step]], LAYER.LEAD, when);
    },
    // Silent layers don't start new notes.
    voice(buffer, layer, when) {
      if (this.targets[layer] <= 0 && this.layers[layer].gain.value < 0.001) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buffer; src.connect(this.layers[layer]); src.start(when);
    },
  };

  // --- Leaderboard ----------------------------------------------------------
  // Online on claude.ai: one document per player, scores/<user id> =
  // {score, level, at}; names are resolved from the id at render time, never
  // stored. Anywhere else (GitHub Pages, the app) it is the global board of
  // server/, with a local top 10 in localStorage while offline.
  const LOCAL_KEY = 'color-spin-top';
  const board = {
    status: 'loading', // loading | ready (claude.ai) | global | local
    rows: [],          // what the leaderboard shows, sorted, top TOP_SIZE
    localRows: (() => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; } })(),
    names: {},
    myId: null, myBest: 0, db: null, user: null, writing: Promise.resolve(),
    localHighlight: -1, // row of the last local game, -1 = none
    me: null,           // global board: {rank, name, score, level} of this device's player
  };
  function useLocalBoard() {
    board.status = 'local';
    board.rows = board.localRows;
  }
  // Inserts this game into the local top list; returns its rank (0 = not ranked).
  function recordLocal(s, lvl) {
    board.localHighlight = -1;
    if (s <= 0) return 0;
    let i = 0;
    const rows = board.localRows;
    while (i < rows.length && rows[i].score >= s) i++;
    if (i >= TOP_SIZE) return 0;
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    rows.splice(i, 0, { id: `local-${Date.now()}`, score: s, level: lvl, name: playerName,
      date: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` });
    rows.length = Math.min(rows.length, TOP_SIZE);
    saveLocalBoard();
    board.localHighlight = i;
    return i + 1;
  }
  function saveLocalBoard() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(board.localRows)); } catch {}
  }

  // --- Name field (local leaderboard only) ------------------------------------
  // A real <input> over the canvas, so phones bring up their keyboard.
  const nameInput = document.getElementById('name');
  let playerName = (() => { try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; } })();
  let nameShown = false;
  nameInput.addEventListener('input', () => {
    playerName = nameInput.value.trim();
    try { localStorage.setItem(NAME_KEY, playerName); } catch {}
    if (board.localHighlight >= 0) { board.localRows[board.localHighlight].name = playerName; saveLocalBoard(); }
    if (board.status === 'global') {
      net.nameDirty = true;
      clearTimeout(net.nameTimer); net.nameTimer = setTimeout(syncGlobal, 1200);
    }
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') nameInput.blur(); });
  function showNameInput() {
    nameInput.value = playerName; nameShown = true;
    nameInput.style.display = 'block'; nameInput.style.opacity = '0';
  }
  function hideNameInput() {
    if (!nameShown) return;
    nameShown = false; nameInput.blur(); nameInput.style.display = 'none';
  }
  // The friend code field on the friends page.
  const codeInput = document.getElementById('code');
  let codeShown = false;
  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const c = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); hideCodeInput(); if (c) addFriend(c); }
    else if (e.key === 'Escape') hideCodeInput();
  });
  codeInput.addEventListener('blur', () => setTimeout(hideCodeInput, 150));
  function showCodeInput() {
    codeInput.value = ''; codeInput.placeholder = tr('code_hint'); codeShown = true;
    codeInput.style.display = 'block'; codeInput.focus();
  }
  function hideCodeInput() {
    if (!codeShown) return;
    codeShown = false; codeInput.blur(); codeInput.style.display = 'none';
  }
  function placeInput(el, f, alpha = 1) {
    const c = canvas.getBoundingClientRect();
    Object.assign(el.style, {
      left: `${c.left + f.x * scale}px`, top: `${c.top + f.y * scale}px`,
      width: `${f.w * scale}px`, height: `${f.h * scale}px`,
      fontSize: `${30 * scale}px`, borderRadius: `${20 * scale}px`, padding: `0 ${20 * scale}px`,
      opacity: String(alpha),
    });
  }
  // Right under the rank line; the buttons move down to make room for it.
  const nameField = () => ({ x: W / 2 - 170, y: H * 0.62 - 6, w: 340, h: 66 });
  function placeNameInput(alpha) {
    const c = canvas.getBoundingClientRect(), f = nameField();
    Object.assign(nameInput.style, {
      left: `${c.left + f.x * scale}px`, top: `${c.top + f.y * scale}px`,
      width: `${f.w * scale}px`, height: `${f.h * scale}px`,
      fontSize: `${30 * scale}px`, borderRadius: `${20 * scale}px`, padding: `0 ${20 * scale}px`,
      opacity: String(alpha),
    });
  }

  async function initBoard() {
    const cl = window.claude;
    const [db, user] = cl && cl.use ? await Promise.all([cl.use('db'), cl.use('user')]) : [null, null];
    if (!db) {
      useLocalBoard(); refreshGlobal(); syncGlobal();
      for (const rb of Object.values(modeBoards)) { refreshRemote(rb); syncRemote(rb); }
      initSocial();
      return;
    }
    board.db = db; board.user = user;
    board.myId = user ? await user.id() : null;
    if (board.myId) {
      try {
        const snap = await db.doc(`scores/${board.myId}`).get();
        if (snap.exists) board.myBest = Number(snap.data().score) || 0;
      } catch {}
    }
    db.collection('scores').orderBy('score', 'desc').limit(TOP_SIZE).onSnapshot(snap => {
      board.rows = snap.docs.map(d => ({ id: d.id, score: Number(d.data().score) || 0, level: Number(d.data().level) || 1 }));
      board.status = 'ready';
      refreshNames();
    }, () => { if (board.status === 'loading') useLocalBoard(); });
    for (const rb of Object.values(modeBoards)) initClaudeBoard(rb);
  }
  async function refreshNames(rows = board.rows) {
    if (!board.user || !rows.length) return;
    const ps = await board.user.profiles(rows.map(r => r.id));
    for (const id in ps) board.names[id] = ps[id].name;
  }
  // The daily and 60-second boards on claude.ai: one document per player,
  // daily/<user id> = {day, score, level, at} (their best of that day) and
  // sprint/<user id> and hardcore/<user id> = {score, level, at}.
  async function initClaudeBoard(rb) {
    const day = today(), isDaily = rb === daily;
    Object.assign(rb, { source: 'claude', day, status: 'loading' });
    if (board.myId) {
      try {
        const snap = await board.db.doc(`${rb.kind}/${board.myId}`).get();
        if (snap.exists && (!isDaily || snap.data().day === day)) rb.myBest = Number(snap.data().score) || 0;
      } catch {}
    }
    let q = board.db.collection(rb.kind);
    if (isDaily) q = q.where('day', '==', day);
    q.orderBy('score', 'desc').limit(TOP_SIZE).onSnapshot(snap => {
      rb.rows = snap.docs.map(d => ({ id: d.id, score: Number(d.data().score) || 0, level: Number(d.data().level) || 1, mine: d.id === board.myId }));
      const i = rb.rows.findIndex(r => r.mine);
      rb.me = i >= 0 ? { rank: i + 1 } : null;
      rb.status = 'ok';
      refreshNames(rb.rows);
    }, () => { rb.status = 'offline'; });
  }
  function submitClaudeBoard(rb, s, lvl) {
    if (!board.myId || s <= rb.myBest) return;
    rb.myBest = s;
    const doc = { ...(rb === daily ? { day: gameDay } : {}), score: s, level: lvl, at: Date.now() };
    board.writing = board.writing.then(() => board.db.doc(`${rb.kind}/${board.myId}`).set(doc)).catch(() => {});
  }
  function submitScore(s, lvl) {
    if (!board.db || !board.myId || s <= board.myBest) return;
    board.myBest = s;
    // One write at a time to the player's document.
    board.writing = board.writing.then(() =>
      board.db.doc(`scores/${board.myId}`).set({ score: s, level: lvl, at: Date.now() })
    ).catch(() => {});
  }
  // Position this score would take among the other players (0 = outside the top).
  function onlineRank(s) {
    if (board.status !== 'ready' || s <= 0) return 0;
    const better = board.rows.filter(r => r.id !== board.myId && r.score > s).length;
    return better < TOP_SIZE ? better + 1 : 0;
  }

  // --- Global leaderboard (server/) ---------------------------------------------
  // Each device is an anonymous player with a random id; the server keeps its
  // best game and its name. A game that could not be sent (offline) waits in
  // localStorage and goes out with the next successful sync.
  const SCORES_URL = 'https://scores.espertini.com/v1/scores';
  const PLAYER_KEY = 'color-spin-player', PENDING_KEY = 'color-spin-pending';
  const RETRY_GAP = 2500; // the server takes one write every 2 s per player
  const net = {
    player: (() => {
      try {
        let id = localStorage.getItem(PLAYER_KEY);
        if (!/^[0-9a-f]{32}$/.test(id || '')) {
          id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
          localStorage.setItem(PLAYER_KEY, id);
        }
        return id;
      } catch { return null; }
    })(),
    pending: (() => { try { return JSON.parse(localStorage.getItem(PENDING_KEY)); } catch { return null; } })(),
    lastGame: null, nameDirty: false, nameTimer: 0, busy: false,
  };
  const savePending = () => {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(net.pending)); } catch {}
  };
  // The server leaves out offensive names (server/src/names.js): tell the player, once per name.
  let refusedName = '';
  function checkName(me) {
    if (me && playerName && !me.name && refusedName !== playerName) { refusedName = playerName; showToast(tr('name_refused')); }
  }
  function applyGlobal(data) {
    if (!data || !Array.isArray(data.top)) return;
    checkName(data.me);
    board.status = 'global';
    board.rows = data.top.map(r => ({ name: r.name, score: r.score, level: r.level, mine: !!r.you }));
    board.me = data.me;
  }
  async function refreshGlobal() {
    if (!net.player) return;
    try {
      const res = await fetch(`${SCORES_URL}?player=${net.player}`);
      if (res.ok) applyGlobal(await res.json());
    } catch {} // offline: the local board stays
  }
  // Queues a finished game for the global board (only if it beats the player's best).
  function submitGlobal(s, lvl, n, duration) {
    if (!net.player || s <= 0 || s <= (board.me?.score || 0) || s <= (net.pending?.score || 0)) return false;
    net.pending = net.lastGame = { score: s, level: lvl, hits: n, duration: Math.round(duration * 10) / 10 };
    savePending();
    syncGlobal();
    return true;
  }
  // Sends the waiting game, or just the name when that changed.
  async function syncGlobal() {
    if (net.busy || !net.player) return;
    const game = net.pending;
    if (!game && !net.nameDirty) return;
    net.busy = true; net.nameDirty = false;
    let retry = false, offline = false;
    try {
      const res = await fetch(SCORES_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player: net.player, name: playerName, ...(game || { score: 0, level: 1, hits: 0, duration: 0 }) }),
      });
      if (res.status === 429) { retry = true; if (!game) net.nameDirty = true; }
      else {
        if (res.ok) {
          applyGlobal(await res.json());
          if (game && game === net.lastGame && state === STATE.GAME_OVER && board.me) lastRank = board.me.rank;
        }
        // Sent, or refused by the server (it would be refused again): either way it's done.
        if (res.ok || res.status < 500) { if (net.pending === game) { net.pending = null; savePending(); } }
      }
    } catch {
      offline = true;
      if (!game) net.nameDirty = true; // try again with the next game or launch
    } finally {
      net.busy = false;
    }
    // Rate limited, or a new game or name came in meanwhile.
    if (retry || (!offline && ((net.pending && net.pending !== game) || net.nameDirty))) {
      setTimeout(syncGlobal, RETRY_GAP);
    }
  }

  // --- Daily challenge ----------------------------------------------------------
  // The day is Italian time for everyone, so the challenge changes at midnight in Italy.
  function today() {
    try {
      const d = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
    } catch {}
    return new Date().toISOString().slice(0, 10);
  }
  const dayNumber = day => Math.round((Date.parse(day) - Date.parse(DAILY_START)) / DAY_MS) + 1;
  const twistFor = day => TWISTS[fposmod(dayNumber(day) - 1, TWISTS.length)];
  const twistText = t => TEXT[lang].twists[t.id] || ['', ''];
  const prevDay = day => new Date(Date.parse(day) - DAY_MS).toISOString().slice(0, 10);
  // Deterministic random numbers (mulberry32) seeded from a string.
  function seededRandom(seed) {
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
    return () => {
      h = (h + 0x6D2B79F5) | 0;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // This device's daily results: today's best and the run of days played in a row.
  const dailyRec = (() => { try { return JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch { return {}; } })();
  const todayBest = () => dailyRec.day === today() ? dailyRec.best || 0 : 0;
  function dayStreak() {
    const d = today();
    return dailyRec.lastDay === d || dailyRec.lastDay === prevDay(d) ? dailyRec.streak || 0 : 0;
  }
  // Returns true when the game beats today's best.
  function recordDaily(s) {
    if (dailyRec.day !== gameDay) Object.assign(dailyRec, { day: gameDay, best: 0 });
    if (dailyRec.lastDay !== gameDay) {
      dailyRec.streak = dailyRec.lastDay === prevDay(gameDay) ? (dailyRec.streak || 0) + 1 : 1;
      dailyRec.lastDay = gameDay;
    }
    const improved = s > dailyRec.best;
    if (improved) dailyRec.best = s;
    try { localStorage.setItem(DAILY_KEY, JSON.stringify(dailyRec)); } catch {}
    return improved;
  }

  // The daily and 60-second boards: from the artifact's db on claude.ai, from server/ elsewhere.
  const API_URL = 'https://scores.espertini.com/v1';
  function remoteBoard(kind) {
    const key = `color-spin-pending-${kind}`;
    return {
      kind, key, source: 'server', status: 'idle', // idle | loading | ok | offline
      day: '', rows: [], me: null, players: 0, myBest: 0,
      pending: (() => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } })(),
      lastGame: null, busy: false,
    };
  }
  const daily = remoteBoard('daily'), sprint = remoteBoard('sprint'), hardcore = remoteBoard('hardcore');
  const modeBoards = { daily, sprint, hardcore };
  const savePendingOf = rb => {
    try { localStorage.setItem(rb.key, JSON.stringify(rb.pending)); } catch {}
  };
  function applyRemote(rb, data) {
    if (!data || !Array.isArray(data.top) || (rb === daily && data.day !== daily.day)) return;
    checkName(data.me);
    rb.rows = data.top.map(r => ({ name: r.name, score: r.score, level: r.level, mine: !!r.you }));
    rb.me = data.me; rb.players = data.players || 0; rb.status = 'ok';
  }
  async function refreshRemote(rb) {
    if (rb.source !== 'server') return;
    let query = '';
    if (rb === daily) {
      const day = today();
      if (daily.day !== day) Object.assign(daily, { day, rows: [], me: null, players: 0, status: 'loading' });
      query = `day=${day}&`;
    } else if (rb.status === 'idle') rb.status = 'loading';
    if (!net.player) { rb.status = 'offline'; return; }
    try {
      const res = await fetch(`${API_URL}/${rb.kind}?${query}player=${net.player}`);
      if (res.ok) applyRemote(rb, await res.json()); else if (rb.status !== 'ok') rb.status = 'offline';
    } catch { if (rb.status !== 'ok') rb.status = 'offline'; }
  }
  function submitRemote(rb, s, lvl, n, duration) {
    if (!net.player || s <= 0) return false;
    rb.pending = rb.lastGame = { ...(rb === daily ? { day: gameDay } : {}), score: s, level: lvl, hits: n,
      duration: Math.round(duration * 10) / 10 };
    savePendingOf(rb);
    syncRemote(rb);
    return true;
  }
  // Same flow as syncGlobal; a name change goes through syncGlobal, and the
  // server copies it to the other boards.
  async function syncRemote(rb) {
    if (rb.busy || !net.player || !rb.pending) return;
    const game = rb.pending;
    rb.busy = true;
    let retry = false, offline = false;
    try {
      const res = await fetch(`${API_URL}/${rb.kind}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player: net.player, name: playerName, ...game }),
      });
      if (res.status === 429) retry = true;
      else {
        if (res.ok) applyRemote(rb, await res.json());
        // Refused games are dropped; a 404 (older server) keeps it for later.
        if (res.ok || (res.status < 500 && res.status !== 404)) { if (rb.pending === game) { rb.pending = null; savePendingOf(rb); } }
      }
    } catch {
      offline = true;
    } finally {
      rb.busy = false;
    }
    if (retry || (!offline && rb.pending && rb.pending !== game)) setTimeout(() => syncRemote(rb), RETRY_GAP);
  }

  // --- Friends and duels -------------------------------------------------------
  // The server keeps a public friend code for each player, the friendships and
  // the duels (server/src/social.js). Not on claude.ai, which can't reach it.
  const SEEN_SOCIAL_KEY = 'color-spin-social-seen', RESTORED_KEY = 'color-spin-restored';
  const social = {
    status: 'idle', // idle | ok | offline
    code: '', me: null, friends: [], duels: [], duel: null, unseen: false,
    removing: null, // { code, time }: a first tap on a friend; a second one removes them
  };
  const socialOn = () => !!net.player && board.status !== 'ready' && board.status !== 'loading';
  const formatCode = c => c ? `${c.slice(0, 4)}-${c.slice(4)}` : '';
  const playUrl = query => `https://${SHARE_URL}/play/?${query}`;
  async function api(path, body) {
    const res = await fetch(`${API_URL}/${path}`, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ player: net.player, ...body }),
    } : undefined);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'error'), { code: data.error });
    return data;
  }
  async function initSocial() {
    if (!socialOn()) return;
    try { social.code = (await api('profile', { name: playerName })).code; } catch {}
    refreshSocial();
  }
  async function refreshSocial() {
    if (!socialOn()) return;
    try {
      const [f, d] = await Promise.all([api(`friends?player=${net.player}&day=${today()}`), api(`duels?player=${net.player}`)]);
      applyFriends(f); social.duels = d.duels; social.status = 'ok';
    } catch { if (social.status !== 'ok') social.status = 'offline'; }
    updateUnseen();
  }
  function applyFriends(f) {
    social.me = f.me; social.friends = f.friends || [];
    if (f.me) social.code = f.me.code;
  }
  // A dot on the friends icon: a friend beat you in today's challenge, or someone played your duel.
  function seenMarks() {
    const best = Math.max(-1, ...social.friends.map(f => f.today ?? -1));
    const duels = Math.max(0, ...social.duels.filter(d => d.mine).map(d => d.played_at || 0));
    return { beat: `${today()}:${best}`, duels };
  }
  function updateUnseen() {
    const seen = loadJSON(SEEN_SOCIAL_KEY, {}), marks = seenMarks();
    const beaten = social.me && social.me.today != null && social.friends.some(f => f.today != null && f.today > social.me.today);
    social.unseen = (beaten && seen.beat !== marks.beat) || marks.duels > (seen.duels || 0);
  }
  function markSocialSeen() { saveJSON(SEEN_SOCIAL_KEY, seenMarks()); social.unseen = false; }
  async function addFriend(code) {
    if (!socialOn()) { showToast(tr('offline_social')); return; }
    try {
      const f = await api('friends', { code, day: today() });
      applyFriends(f); showToast(tr('friend_added', f.added || tr('player'))); sfx.play('power'); haptic('success');
    } catch (e) {
      showToast(tr(e.code === 'unknown code' || e.code === 'bad code' ? 'code_unknown' : e.code === 'own code' ? 'code_own' : 'offline_social'));
    }
  }
  async function removeFriend(code) {
    try { applyFriends(await api('friends/remove', { code, day: today() })); sfx.play('click'); } catch { showToast(tr('offline_social')); }
  }
  async function loadDuel(id) {
    if (!socialOn()) { showToast(tr('offline_social')); return; }
    try {
      social.duel = await api(`duels/${id}?player=${net.player}`);
      hideNameInput(); hideCodeInput();
      state = STATE.DUEL; fade = 0.6; sfx.play('click');
    } catch { showToast(tr('duel_missing')); }
  }
  // After a classic game: send it to a friend. After a duel: send your own run back.
  async function createDuel() {
    if (!socialOn()) { showToast(tr('offline_social')); return; }
    try {
      const { id } = await api('duels', { name: playerName, seed: gameSeed, score, level, hits,
        duration: Math.round(playTime * 10) / 10, ghost: ghostRec });
      shareLink(tr('share_duel', score, playUrl(`duello=${id}`)));
    } catch { showToast(tr('offline_social')); }
  }
  async function submitDuelResult() {
    const id = social.duel && social.duel.id;
    if (!id || !socialOn()) return;
    try {
      social.duel = await api(`duels/${id}`, { name: playerName, score, level, hits,
        duration: Math.round(playTime * 10) / 10, ghost: ghostRec });
    } catch {}
  }
  // Text with a link: the share sheet, or the clipboard.
  async function shareLink(msg) {
    if (app) { tellApp({ type: 'shareText', text: msg }); return; }
    try { if (navigator.share) { await navigator.share({ text: msg }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(msg); showToast(tr('copied')); } catch { showToast(tr('share_failed')); }
  }
  const shareInvite = () => social.code ? shareLink(tr('share_invite', playUrl(`amico=${social.code}`))) : showToast(tr('offline_social'));
  const shareRecovery = () => net.player ? shareLink(tr('share_recovery', playUrl(`recupero=${net.player}`))) : null;

  // Links: ?amico=CODE, ?duello=ID, ?recupero=PLAYER on the web, colorspin://amico/CODE and so on in the app.
  const linkQueue = [];
  function handleLink(url) {
    let u;
    try { u = new URL(url, location.href); } catch { return; }
    const q = u.searchParams, get = k => q.get(k) || '';
    let friend = get('amico'), duel = get('duello'), restore = get('recupero');
    if (u.protocol === 'colorspin:') {
      const [kind, value = ''] = `${u.host}${u.pathname}`.split('/').filter(Boolean);
      if (kind === 'amico') friend = value; else if (kind === 'duello') duel = value; else if (kind === 'recupero') restore = value;
    }
    if (/^[0-9a-f]{32}$/.test(restore) && restore !== net.player) {
      try { localStorage.setItem(PLAYER_KEY, restore); localStorage.setItem(RESTORED_KEY, '1'); } catch {}
      location.replace(location.pathname);
      return;
    }
    if (friend) addFriend(friend.toUpperCase().replace(/[^A-Z0-9]/g, ''));
    if (duel) loadDuel(duel.toUpperCase().replace(/[^A-Z0-9]/g, ''));
  }
  if (/[?&](amico|duello|recupero)=/.test(location.search)) {
    linkQueue.push(location.href);
    try { history.replaceState(null, '', location.pathname); } catch {}
  }

  // --- Sharing --------------------------------------------------------------
  // A square picture of the game just played: the shape it reached, the score
  // and, for the daily challenge, its number, rule and rank.
  function makeShareCard() {
    const S = 1080, card = document.createElement('canvas');
    card.width = card.height = S;
    const main = ctx;
    ctx = card.getContext('2d');
    try {
      const g = ctx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, rgba(BG_TOP)); g.addColorStop(1, rgba(BG_BOTTOM));
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      for (let i = 0; i < 70; i++) circle(Math.random() * S, Math.random() * S, rand(1, 3), 'rgba(255,255,255,0.08)');
      for (let i = 0; i < 6; i++) circle(S / 2, 470, 230 + i * 45, 'rgba(255,255,255,0.015)');
      // COLOR in the palette's colors, SPIN in white, like the menu.
      ctx.font = `800 88px ${FONT}`;
      const word = [...'COLOR'].map((ch, i) => [ch, PALETTE[i]]).concat([[' SPIN', WHITE]]);
      let x = (S - word.reduce((w, [ch]) => w + ctx.measureText(ch).width, 0)) / 2;
      for (const [ch, c] of word) { text(x, 130, ch, 88, c); x += ctx.measureText(ch).width; }
      const n = dayNumber(gameDay);
      const sub = mode === 'daily' ? `${tr('daily', n)}  ·  ${twistText(twist)[0]}`
        : mode === 'sprint' || mode === 'hardcore' ? `${tr(`mode_${mode}`)}  ·  ${tr('card_classic')}` : tr('card_classic');
      text(S / 2, 200, sub, 34, PALETTE[2], 1, 'center');
      ctx.save(); ctx.translate(S / 2, 470); ctx.scale(1.6, 1.6); shape.draw(0, 0); ctx.restore();
      text(S / 2, 860, String(score), 170, WHITE, 1, 'center');
      text(S / 2, 915, tr('points_level', level, bestStreak), 30, WHITE, 0.6, 'center');
      const rb = modeBoard();
      if (rb && rb.me) text(S / 2, 965, rankText(rb), 32, PALETTE[2], 1, 'center');
      const streakDays = mode === 'daily' ? dayStreak() : 0;
      text(S / 2, 1040, streakDays >= 2 ? `${tr('daily_streak', streakDays)}  ·  ${SHARE_URL}` : SHARE_URL, 26, WHITE, 0.45, 'center');
    } finally {
      ctx = main;
    }
    return card;
  }
  // The board of the mode being played, when it has its own.
  const modeBoard = () => modeBoards[mode] || null;
  const rankText = rb => rb === daily
    ? (rb.players ? tr('daily_rank_of', rb.me.rank, rb.players) : tr('daily_rank', rb.me.rank))
    : (rb.players ? tr('rank_of', rb.me.rank, rb.players) : tr('rank', rb.me.rank));
  function shareText() {
    const t = mode === 'daily' ? tr('share_daily', dayNumber(gameDay), twistText(twist)[0], score)
      : mode === 'sprint' || mode === 'hardcore' ? tr(`share_${mode}`, score) : tr('share_classic', score);
    return `${t} https://${SHARE_URL}`;
  }
  async function share() {
    const card = makeShareCard(), msg = shareText();
    if (app) { tellApp({ type: 'share', image: card.toDataURL('image/png'), text: msg }); return; }
    const blob = await new Promise(r => card.toBlob(r, 'image/png'));
    const name = mode === 'daily' ? `color-spin-${gameDay}.png` : 'color-spin.png';
    try {
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: msg });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // the player closed the share sheet
    }
    // No share sheet (desktop, or inside claude.ai): save the image and copy the text.
    try { await navigator.clipboard.writeText(msg); } catch {}
    const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    try {
      if (downloads) await downloads.save({ filename: name, data: blob });
      else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }
      showToast(tr('saved'));
    } catch (e) {
      if (!e || e.code !== 'declined') showToast(tr('share_failed'));
    }
  }
  let toast = null;
  const showToast = msg => { toast = { text: msg, time: 2.5 }; };

  // --- Effects --------------------------------------------------------------
  let particles = [], rings = [], texts = [];
  function burst(x, y, color, count = 14, speed = 280) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU, sp = speed * rand(0.3, 1), life = rand(0.35, 0.7);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, color, size: rand(3, 7), life, max: life });
    }
  }
  const ring = (x, y, color, from, to, dur = 0.35) => rings.push({ x, y, color, from, to, life: dur, max: dur });
  const floatText = (x, y, text, color) => texts.push({ x, y, text, color, life: 0.7, max: 0.7 });
  const clearFx = () => { particles = []; rings = []; texts = []; };

  function updateFx(dt) {
    for (const p of particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const drag = Math.max(1 - 3 * dt, 0); p.vx *= drag; p.vy *= drag;
    }
    for (const r of rings) r.life -= dt;
    for (const t of texts) { t.life -= dt; t.y -= 70 * dt; }
    particles = particles.filter(p => p.life > 0);
    rings = rings.filter(r => r.life > 0);
    texts = texts.filter(t => t.life > 0);
  }

  function drawFx(ox, oy) {
    for (const r of rings) {
      const t = 1 - r.life / r.max;
      ctx.beginPath(); ctx.arc(ox + r.x, oy + r.y, lerp(r.from, r.to, 1 - (1 - t) ** 3), 0, TAU);
      ctx.strokeStyle = rgba(r.color, 1 - t); ctx.lineWidth = 1 + 5 * (1 - t); ctx.stroke();
    }
    for (const p of particles) {
      const t = p.life / p.max;
      ctx.beginPath(); ctx.arc(ox + p.x, oy + p.y, p.size * t, 0, TAU);
      ctx.fillStyle = rgba(p.color, t); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `800 34px ${FONT}`;
    for (const t of texts) {
      ctx.fillStyle = rgba(t.color, clamp(t.life / t.max * 2, 0, 1));
      ctx.fillText(t.text, ox + t.x, oy + t.y);
    }
  }

  // --- Game state -----------------------------------------------------------
  let state = STATE.MENU, score = 0, best = loadBest(), newBest = false;
  let lives = MAX_LIVES, level = 1, spawnTimer = 0, menuTurnTimer = 0;
  let shake = 0, flash = 0, fade = 0, scorePop = 0, banner = '', bannerTime = 0;
  let gameOverTime = 0, pauseTime = 0, resumeTimer = 0, time = 0, worldX = 0, worldY = 0;
  let streak = 0, arrowFlash = [0, 0], lastRank = 0, lastGameImproved = false, playTime = 0;
  // hits: balls matched (they set the level); score adds the combo and bonus points.
  let hits = 0, bestStreak = 0, comboPop = 0, slowTime = 0, hint = null;
  // calm: see CALM_BALLS; the rest is combo feedback (flash, zoom kick, every-10 pop, lost combo).
  // gameSeed: classic games are seeded too, so any of them can become a duel;
  // ghostRec: the score at every second of play, the duel's ghost.
  let gameSeed = '', ghostRec = [0];
  let calm = 0, comboFlash = 0, comboColor = WHITE, kick = 0, milestone = null, comboLost = null;
  // mode: 'classic' or 'daily'; rng drives the balls (seeded in the daily challenge).
  let mode = 'classic', twist = NO_TWIST, rng = Math.random, gameDay = today(), maxLives = MAX_LIVES;
  let boardTab = 'all'; // leaderboard screen: 'all', 'sprint' or 'today'
  // The mode picked on the menu, and the 60-second clock.
  let menuMode = (() => { try { return localStorage.getItem(MODE_KEY); } catch { return null; } })();
  if (!MODES.includes(menuMode)) menuMode = 'classic';
  let modeFlash = 0, pageScroll = 0, pageVel = 0, pageMax = 0;
  let clock = 0;
  // Records of the 60-second and hardcore modes (the classic one is `best`).
  const records = {};
  for (const m of ['sprint', 'hardcore']) {
    try { records[m] = parseInt(localStorage.getItem(`color-spin-best-${m}`), 10) || 0; } catch { records[m] = 0; }
  }
  let seen = (() => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); } catch { return new Set(); } })();
  let balls = [];
  let dots = [];

  function loadBest() {
    try { return parseInt(localStorage.getItem(SAVE_KEY), 10) || 0; } catch { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem(SAVE_KEY, String(best)); } catch {}
  }

  let splashTime = 0, splashBurst = false;
  function startSplash() {
    state = STATE.SPLASH; splashTime = 0; splashBurst = false; fade = 0;
  }

  function goToMenu() {
    hideNameInput();
    balls = []; clearFx();
    state = STATE.MENU; shape.setup(MENU_SIDES); menuTurnTimer = 1; fade = 1;
    awardQueue.length = 0; // the awards page lists them anyway
    hideCodeInput();
    if (social.removing) social.removing = null;
    // Invite and duel links wait for the opening to finish.
    if (linkQueue.length) { const links = linkQueue.splice(0); setTimeout(() => links.forEach(handleLink), 400); }
    refreshSocial();
    music.playMenu();
  }

  function start(m = mode) {
    hideNameInput();
    mode = m; gameDay = today();
    twist = mode === 'daily' ? twistFor(gameDay) : NO_TWIST;
    if (mode === 'duel') gameSeed = social.duel.seed;
    else if (mode === 'classic') gameSeed = Array.from({ length: 10 }, () => 'abcdefghijkmnpqrstuvwxyz23456789'[Math.random() * 32 | 0]).join('');
    rng = mode === 'daily' ? seededRandom(`color-spin-${gameDay}`)
      : mode === 'classic' || mode === 'duel' ? seededRandom(`classic-${gameSeed}`) : Math.random;
    maxLives = mode === 'hardcore' ? 1 : twist.lives || MAX_LIVES;
    ghostRec = [0];
    balls = []; clearFx();
    score = 0; lives = maxLives; level = 1; newBest = false; spawnTimer = 1;
    hits = 0; bestStreak = 0; comboPop = 0; slowTime = 0; hint = null;
    calm = 0; comboFlash = 0; kick = 0; milestone = null; comboLost = null;
    streak = 0; lastRank = 0; lastGameImproved = false; playTime = 0;
    state = STATE.PLAYING; fade = 1;
    shape.setup(sidesForLevel(level));
    music.playGame(...musicLevel());
    clock = SPRINT_TIME;
    if (mode === 'daily') {
      showBanner(tr('daily', dayNumber(gameDay)));
      const [title, line] = twistText(twist);
      hint = { title, line, time: 3.5 };
      refreshRemote(daily);
    } else if (mode === 'sprint') {
      hint = { title: tr('mode_sprint'), line: tr('mode_info_sprint'), time: 3.5 };
      refreshRemote(sprint);
    } else if (mode === 'zen' || mode === 'hardcore') {
      hint = { title: tr(`mode_${mode}`), line: tr(`mode_info_${mode}`), time: 3.5 };
      if (mode === 'hardcore') refreshRemote(hardcore);
    } else showBanner(mode === 'duel' ? tr('duel_title') : tr('banner_level', 1));
  }
  // Zen keeps the music calm: the first tempo and at most three instruments more.
  const musicLevel = () => mode === 'zen' ? [1, Math.min(tier(level), 2)] : [level, tier(level)];
  const hasLives = () => mode === 'classic' || mode === 'daily' || mode === 'hardcore' || mode === 'duel';

  const tier = lvl => Math.min(Math.floor((lvl - 1) / LEVELS_PER_SIDE), MAX_SIDES - MIN_SIDES);
  const sidesForLevel = lvl => MIN_SIDES + tier(lvl);
  function difficulty() {
    const t = tier(level);
    return 0.7 * t + 0.5 * (level - 1 - t * LEVELS_PER_SIDE);
  }
  // Zen stops getting faster at an easy pace; 60 seconds starts at a brisker one.
  const pace = () => mode === 'zen' ? Math.min(difficulty(), ZEN_PACE)
    : mode === 'sprint' ? difficulty() + SPRINT_BOOST
    : mode === 'hardcore' ? difficulty() + HARDCORE_BOOST : difficulty();
  // calm: balls left in the breather after a new shape (slower, at most 2 at a time).
  const calmK = () => 1 + CALM_SLOW * calm / CALM_BALLS;
  const travelTime = () => Math.max(1, 2.9 - 0.25 * pace()) / (twist.speed || 1) * calmK();
  const spawnInterval = () => Math.max(0.5, 1.7 - 0.18 * pace()) * calmK();
  const maxBalls = () => Math.min(level + 1, 3 + tier(level), calm > 0 ? 2 : 99);
  const multiplier = () => 1 + COMBO_STEPS.filter(n => streak >= n).length;

  // Special balls, unlocked as the game goes on: [kind, from level, chance per ball].
  // The chameleon keeps getting more frequent, so the game still changes past the octagon.
  const SPECIALS = [
    ['heart', 4, () => (mode === 'sprint' || lives < maxLives) && !balls.some(b => b.kind === 'heart') ? 0.05 : 0],
    ['jolly', 8, () => 0.05], // not at 7: the pentagon is enough news
    ['slow', 10, () => slowTime > 0 || balls.some(b => b.kind === 'slow') ? 0 : 0.03],
    ['chameleon', 16, from => Math.min(0.12 + 0.02 * (level - from), 0.4)],
  ];
  function pickSpecial(roll) {
    let p = 0;
    for (const [kind, usual, chance] of SPECIALS) {
      // The rule of the day can bring a ball in earlier or make it more frequent.
      // Zen has nothing to win back and no surprises.
      if (mode === 'zen' && (kind === 'heart' || kind === 'chameleon')) continue;
      if (mode === 'hardcore' && kind === 'heart') continue;
      const [from, often] = mode === 'hardcore' && kind === 'chameleon' ? [10]
        : (twist.special && twist.special[kind]) || [usual];
      if (level < from) continue;
      const c = chance(from);
      p += often !== undefined && c > 0 ? often : c;
      if (roll < p) return kind;
    }
    return null;
  }
  // The first time ever a special ball shows up, say what it does.
  function introduce(kind) {
    if (seen.has(kind)) return;
    seen.add(kind);
    try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch {}
    const [title, line] = TEXT[lang].specials[kind];
    hint = { title, line, time: 3.5 };
  }
  const showBanner = text => { banner = text; bannerTime = 1.2; };

  function spawnBall() {
    // Always four draws per ball, so the daily sequence stays the same for everyone.
    const [dx, dy] = SPAWN_DIRS[rng() * 4 | 0];
    const ci = rng() * shape.sides | 0, kind = pickSpecial(rng()), other = rng();
    const dist = Math.abs(dx) * W / 2 + Math.abs(dy) * H / 2 + BALL_RADIUS;
    const v = (dist - SHAPE_RADIUS) / travelTime();
    // Same travel time from every edge, so a portrait screen stays fair.
    const b = { kind, ci, color: PALETTE[ci], x: dx * dist, y: dy * dist, vx: -dx * v, vy: -dy * v, trail: [] };
    // The chameleon switches color with 0.7 s left to react.
    if (kind === 'chameleon') {
      b.switchAt = SHAPE_RADIUS + v * 0.7;
      b.switchTo = (ci + 1 + (other * (shape.sides - 1) | 0)) % shape.sides;
    }
    balls.push(b);
    if (kind) introduce(kind);
    if (calm > 0) calm--;
  }

  function checkHits() {
    for (const b of balls) {
      if (b.dead) continue;
      const angle = Math.atan2(b.y, b.x);
      if (Math.hypot(b.x, b.y) - BALL_RADIUS > shape.edgeDistance(angle)) continue;
      b.dead = true;
      if (b.kind === 'jolly' || shape.sideAt(angle) === b.ci) onScore(b); else onMiss(b);
      if (state !== STATE.PLAYING) break;
    }
    balls = balls.filter(b => !b.dead);
  }

  function onScore(b) {
    const before = multiplier();
    sfx.chime(streak); streak++; hits++;
    bestStreak = Math.max(bestStreak, streak);
    const mult = multiplier(), points = (b.kind === 'jolly' ? JOLLY_POINTS : 1) * mult;
    score += points; scorePop = 1; shape.pulse();
    const color = b.kind === 'jolly' ? jollyColor(b) : b.color;
    burst(b.x, b.y, color); ring(b.x, b.y, color, 10, 70);
    const len = Math.hypot(b.x, b.y) || 1;
    floatText(b.x + b.x / len * 50, b.y + b.y / len * 50, `+${points}`, color);
    if (mult > before) {
      // A new multiplier: banner, a flash and a ring in its color, a kick of the whole board.
      comboPop = 1; sfx.play('combo'); showBanner(tr('banner_combo', mult));
      comboColor = hex(COMBO_COLORS[mult]); comboFlash = 1; kick = 1;
      ring(0, 0, comboColor, 70, 560, 0.7);
      for (const c of shape.colors) burst(0, 0, c, 4, 520);
      haptic('success');
    } else if (streak >= 20 && streak % 10 === 0 && !COMBO_STEPS.includes(streak)) {
      // Every 10 more: the count pops over the shape.
      milestone = { n: streak, t: 1 }; kick = Math.max(kick, 0.5);
      sfx.play('milestone'); haptic('medium');
    } else haptic('light');
    if (b.kind === 'heart' && mode === 'sprint') {
      clock += SPRINT_HEART; sfx.play('power'); showBanner(tr('banner_time', SPRINT_HEART));
    } else if (b.kind === 'heart' && lives < maxLives) { lives++; sfx.play('power'); showBanner(tr('banner_heart')); }
    if (b.kind === 'slow') { slowTime = SLOW_TIME; music.setSlow(true); sfx.play('power'); showBanner(tr('banner_slow')); }
    if (b.kind === 'jolly') { sfx.play('power'); for (const c of shape.colors) burst(b.x, b.y, c, 3, 320); }
    if (hits % POINTS_PER_LEVEL === 0) levelUp();
    if (b.kind && !awardsRec.caught.includes(b.kind)) awardsRec.caught.push(b.kind);
    checkAwards();
  }

  function onMiss(b) {
    const lost = streak;
    streak = 0;
    if (mode === 'zen') { burst(b.x, b.y, [0.75, 0.75, 0.8], 8, 150); sfx.play('soft'); return; }
    shake = 14; flash = 1; haptic('heavy');
    // A real combo breaking apart, so it hurts a little.
    if (lost >= 10) { comboLost = { n: lost, t: 1.4 }; sfx.play('lost'); }
    burst(b.x, b.y, [0.75, 0.75, 0.8], 10, 200); ring(b.x, b.y, PALETTE[0], 10, 90);
    if (mode === 'sprint') {
      clock = Math.max(clock - SPRINT_MISS, 0);
      floatText(b.x, b.y - 40, `-${SPRINT_MISS}s`, PALETTE[0]);
      if (clock <= 0) gameOver(); else sfx.play('miss');
      return;
    }
    lives--;
    if (lives <= 0) gameOver(); else sfx.play('miss');
  }

  function levelUp() {
    level++;
    music.setLevel(...musicLevel());
    const n = sidesForLevel(level);
    if (n !== shape.sides) {
      // New figure: clear the board, a moment to look at it, and a life back.
      for (const b of balls) b.dead = true;
      shape.setup(n); shape.highlightNew();
      calm = CALM_BALLS;
      sfx.play('figure');
      ring(0, 0, WHITE, 60, 450, 0.6);
      for (const c of shape.colors) burst(0, 0, c, 6, 420);
      spawnTimer = 1.5;
      if (lives < maxLives) { lives++; showBanner(tr('banner_life', level)); return; }
    } else {
      sfx.play('level');
    }
    showBanner(tr('banner_level', level));
  }

  function pause() {
    state = STATE.PAUSED; pauseTime = 0; resumeTimer = 0;
    sfx.play('click'); music.setDucked(true);
  }

  function gameOver() {
    state = STATE.GAME_OVER; gameOverTime = 0;
    finishGame();
  }
  function finishGame() {
    try { recordGame(); } finally { checkAwards(); }
  }
  function recordGame() {
    sfx.play('game_over'); music.stop();
    for (const b of balls) b.dead = true;
    for (const c of shape.colors) burst(0, 0, c, 10, 450);
    if (slowTime > 0) { slowTime = 0; music.setSlow(false); }
    // A duel only counts against its ghost: no records, no boards.
    if (mode === 'duel') { submitDuelResult(); return; }
    if (mode === 'daily') {
      // The daily challenge has its own records and board.
      board.localHighlight = -1;
      newBest = lastGameImproved = recordDaily(score);
      if (!newBest) return;
      if (daily.source === 'claude') submitClaudeBoard(daily, score, level);
      else if (submitRemote(daily, score, level, hits, playTime)) showNameInput();
      return;
    }
    if (mode === 'sprint' || mode === 'hardcore') {
      // Their own record and board.
      const rb = modeBoards[mode];
      board.localHighlight = -1;
      if (score > records[mode]) {
        records[mode] = score; newBest = true;
        try { localStorage.setItem(`color-spin-best-${mode}`, String(score)); } catch {}
      }
      if (rb.source === 'claude') submitClaudeBoard(rb, score, level);
      else if (score > (rb.me?.score || 0) && score > (rb.pending?.score || 0) &&
        submitRemote(rb, score, level, hits, playTime)) { lastGameImproved = true; showNameInput(); }
      return;
    }
    if (score > best) { best = score; newBest = true; saveBest(); }
    if (board.status === 'ready') {
      lastGameImproved = board.myId !== null && score > board.myBest;
      lastRank = lastGameImproved ? onlineRank(score) : 0;
      submitScore(score, level);
      return;
    }
    // The local top 10 keeps every game, for when the device is offline.
    const localRank = recordLocal(score, level);
    const queued = submitGlobal(score, level, hits, playTime);
    if (board.status === 'global') {
      // The global rank shows up when the server answers.
      lastGameImproved = queued; lastRank = 0;
      if (queued) showNameInput();
    } else {
      lastRank = localRank;
      if (lastRank > 0) showNameInput();
    }
  }

  // --- Input ----------------------------------------------------------------
  // Play (with the mode arrows at its sides), the daily challenge under it,
  // and the leaderboard as an icon next to the settings.
  const menuButtons = () => {
    const y = H / 2 + 236 + (H - BASE_H) * 0.3; // a bit lower on tall phones
    return [
      { x: W / 2 - 180, y, w: 360, h: 112 },
      { x: W - 176, y: 24, w: 68, h: 68 },
      { x: W / 2 - 200, y: y + 136, w: 400, h: 100 },
      { x: W / 2 - 268, y: y + 18, w: 76, h: 76 },
      { x: W / 2 + 192, y: y + 18, w: 76, h: 76 },
      { x: 108, y: 24, w: 68, h: 68 },
    ];
  };
  // Classic, 60 seconds, hardcore, today.
  const BOARD_TABS = ['all', 'sprint', 'hardcore', 'today'];
  const boardTabs = () => BOARD_TABS.map((t, i) => ({ x: W / 2 - 332 + i * 168, y: H * 0.1 + 30, w: 160, h: 56 }));

  const settingsButton = () => ({ x: W - 92, y: 24, w: 68, h: 68 });
  // Music, sounds, language, back.
  // Music, sounds, language, vibration, symbols (with their preview under it), recovery link, back.
  const settingsButtons = () => [0, 1, 2, 3, 4, 5, 6].map(i =>
    ({ x: W / 2 - 260, y: H * 0.2 + i * 94 + (i >= 5 ? 50 : 0) + (i === 6 ? 28 : 0), w: 520, h: 78 }));
  let linkRect = { x: 0, y: 0, w: 0, h: 0 }; // the site link on the about screen, set when drawn
  const infoButton = () => ({ x: 24, y: 24, w: 68, h: 68 });
  // Top center, between the score and the lives.
  const pauseButton = () => ({ x: W / 2 - 34, y: 22, w: 68, h: 68 });
  const pauseButtons = () => [
    { x: W / 2 - 150, y: H * 0.45, w: 300, h: 88 },
    { x: W / 2 - 150, y: H * 0.45 + 108, w: 300, h: 88 },
  ];
  // Music and sound effects toggles, side by side under the pause buttons.
  const pauseAudioButtons = () => [
    { x: W / 2 - 84, y: H * 0.45 + 232, w: 68, h: 68 },
    { x: W / 2 + 16, y: H * 0.45 + 232, w: 68, h: 68 },
  ];

  const grow = (r, k) => ({ x: r.x - k, y: r.y - k, w: r.w + 2 * k, h: r.h + 2 * k });
  // Play again; then (after a classic game) challenge a friend and share, or
  // (after a duel) send it back; and the menu.
  const gameOverButtons = () => {
    const y = H * 0.62 + (nameShown ? NAME_ROW : 0), on = socialOn();
    const replay = { id: 'replay', x: W / 2 - 210, y, w: 420, h: 88 };
    if (mode === 'classic' && on) return [replay, { id: 'duel', x: W / 2 - 210, y: y + 108, w: 202, h: 88 },
      { id: 'share', x: W / 2 + 8, y: y + 108, w: 202, h: 88 }, { id: 'menu', x: W / 2 - 210, y: y + 216, w: 420, h: 76 }];
    const second = mode === 'duel' ? (on ? 'sendback' : null) : 'share';
    return [replay, ...(second ? [{ id: second, x: W / 2 + 8, y: y + 108, w: 202, h: 88 }] : []),
      { id: 'menu', x: W / 2 - 210, y: y + 108, w: second ? 202 : 420, h: 88 }];
  };
  // Friends icon, left of the leaderboard's.
  const friendsButton = () => ({ x: W - 260, y: 24, w: 68, h: 68 });
  const hit = (r, p) => p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  function handle(action, pos) {
    sfx.unlock();
    if (state === STATE.SPLASH) { if (splashTime > 0.3) goToMenu(); return; }
    if (action === 'music') { toggleMusic(); return; }
    if (action === 'effects') { toggleSound(); return; }
    if (action === 'language') { toggleLanguage(); return; }
    if (state === STATE.MENU) {
      if (action === 'tap' && hit(settingsButton(), pos)) {
        sfx.play('click'); state = STATE.SETTINGS; fade = 0.6;
      }
      else if (action === 'tap' && hit(menuButtons()[1], pos)) {
        sfx.play('click'); state = STATE.LEADERBOARD; fade = 0.6; refreshNames();
        boardTab = BOARD_TABS.includes(menuMode) ? menuMode : 'all';
        if (board.status === 'global' || board.status === 'local') { refreshGlobal(); syncGlobal(); }
        for (const rb of Object.values(modeBoards)) { refreshRemote(rb); syncRemote(rb); }
      } else if (action === 'tap' && socialOn() && hit(friendsButton(), pos)) {
        sfx.play('click'); state = STATE.FRIENDS; fade = 0.6; pageScroll = pageVel = 0;
        markSocialSeen(); refreshSocial();
      } else if (action === 'tap' && hit(menuButtons()[5], pos)) {
        sfx.play('click'); state = STATE.AWARDS; fade = 0.6; pageScroll = pageVel = 0;
      } else if (action === 'tap' && hit(menuButtons()[2], pos)) {
        start('daily');
      } else if (action === 'left' || action === 'right' || (action === 'tap' && (hit(menuButtons()[3], pos) || hit(menuButtons()[4], pos)))) {
        // The arrows (or the keyboard) go through the modes.
        const dir = action === 'left' || (action === 'tap' && hit(menuButtons()[3], pos)) ? -1 : 1;
        menuMode = MODES[fposmod(MODES.indexOf(menuMode) + dir, MODES.length)];
        try { localStorage.setItem(MODE_KEY, menuMode); } catch {}
        sfx.play(dir < 0 ? 'turn_left' : 'turn_right'); modeFlash = dir;
      } else if (action === 'info' || (action === 'tap' && hit(infoButton(), pos))) {
        sfx.play('click'); state = STATE.ABOUT; fade = 0.6; pageScroll = pageVel = 0;
      } else if (action !== 'back') start(menuMode);
    } else if (state === STATE.PLAYING) {
      if (action === 'pause' || action === 'back' || (action === 'tap' && hit(grow(pauseButton(), 12), pos))) {
        pause(); return;
      }
      let dir = 0;
      if (action === 'left') dir = -1;
      else if (action === 'right' || action === 'confirm') dir = 1;
      else if (action === 'tap') dir = pos.x < W / 2 ? -1 : 1;
      if (dir) {
        shape.rotateStep(dir);
        sfx.play(dir < 0 ? 'turn_left' : 'turn_right');
        arrowFlash[dir < 0 ? 0 : 1] = 1;
      }
    } else if (state === STATE.PAUSED) {
      if (resumeTimer > 0) return;
      const b = pauseButtons();
      const audio = pauseAudioButtons();
      if (action === 'tap' && hit(audio[0], pos)) toggleMusic();
      else if (action === 'tap' && hit(audio[1], pos)) toggleSound();
      else if (['confirm', 'pause', 'back'].includes(action) || hit(b[0], pos)) {
        sfx.play('click'); resumeTimer = RESUME_BEATS * RESUME_BEAT;
      } else if (hit(b[1], pos)) {
        // Leaving mid-game: the run is dropped, not recorded.
        sfx.play('click'); goToMenu();
      }
    } else if (state === STATE.GAME_OVER) {
      if (gameOverTime < 0.6) return;
      const id = action === 'confirm' ? 'replay' : action === 'back' ? 'menu' : (gameOverButtons().find(r => hit(r, pos)) || {}).id;
      if (!id) return;
      sfx.play('click');
      if (id === 'replay') start();
      else if (id === 'share') share();
      else if (id === 'duel' || id === 'sendback') createDuel();
      else if (id === 'menu') goToMenu();
    } else if (state === STATE.SETTINGS) {
      const rows = settingsButtons();
      if (action === 'tap' && hit(rows[0], pos)) toggleMusic();
      else if (action === 'tap' && hit(rows[1], pos)) toggleSound();
      else if (action === 'tap' && hit(rows[2], pos)) toggleLanguage();
      else if (action === 'tap' && hit(rows[3], pos)) toggleVibrate();
      else if (action === 'tap' && hit(rows[4], pos)) toggleSymbols();
      else if (action === 'tap' && socialOn() && hit(rows[5], pos)) { sfx.play('click'); shareRecovery(); }
      else if (action === 'back' || (action === 'tap' && hit(rows[6], pos))) {
        sfx.play('click'); state = STATE.MENU; fade = 0.6;
      }
    } else if (state === STATE.LEADERBOARD && action === 'tap' && hit(reportRect, pos)) {
      sfx.play('click'); openLink(SITE_URL);
    } else if (state === STATE.LEADERBOARD && action === 'tap' && boardTabs().some(r => hit(r, pos))) {
      sfx.play('click');
      boardTab = BOARD_TABS[boardTabs().findIndex(r => hit(r, pos))];
      const rb = boardTab === 'today' ? daily : modeBoards[boardTab];
      if (rb) refreshRemote(rb);
    } else if (scrolls() && (action === 'up' || action === 'down')) {
      pageVel = 0; pageScroll = clamp(pageScroll + (action === 'up' ? -120 : 120), 0, pageMax);
    } else if (state === STATE.FRIENDS && action === 'tap' && pos.y < pageBottom() &&
      friendRects.some(o => hit(o.r, { x: pos.x, y: pos.y + pageScroll }))) {
      friendTap(friendRects.find(o => hit(o.r, { x: pos.x, y: pos.y + pageScroll })));
    } else if (state === STATE.DUEL) {
      const b = duelButtons(), on = id => hit(b.find(r => r.id === id), pos);
      if (action === 'confirm' || (action === 'tap' && on('play'))) start('duel');
      else if (action === 'tap' && on('share')) shareLink(tr('share_duel', social.duel.owner.score, playUrl(`duello=${social.duel.id}`)));
      else if (action === 'back' || (action === 'tap' && on('menu'))) { sfx.play('click'); goToMenu(); }
    } else if (state === STATE.AWARDS && action === 'tap' && pos.y < pageBottom() &&
      lookRects.some(o => hit(o.r, { x: pos.x, y: pos.y + pageScroll }))) {
      pickLook(lookRects.find(o => hit(o.r, { x: pos.x, y: pos.y + pageScroll })));
    } else if (state === STATE.ABOUT && action === 'tap' && hit(linkRect, pos)) {
      sfx.play('click'); openLink(SITE_URL);
    } else {
      // Any tap or key goes back: the whole screen is the "back" button.
      sfx.play('click'); state = STATE.MENU; fade = 0.6;
    }
  }

  const pointerPos = e => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  };
  // The About and awards pages scroll: there a tap is a release that didn't drag.
  let drag = null;
  const scrolls = () => state === STATE.ABOUT || state === STATE.AWARDS || state === STATE.FRIENDS;
  const pageBottom = () => H * 0.9 - 56;
  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    if (scrolls()) {
      sfx.unlock();
      drag = { pos: pointerPos(e), y: e.clientY, from: pageScroll, moved: false, last: e.clientY, t: performance.now() };
      pageVel = 0;
      try { canvas.setPointerCapture(e.pointerId); } catch {}
      return;
    }
    handle('tap', pointerPos(e));
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = (e.clientY - drag.y) / scale, now = performance.now();
    if (Math.abs(dy) > 10) drag.moved = true;
    if (!drag.moved) return;
    pageScroll = clamp(drag.from - dy, 0, pageMax);
    const dt = Math.max((now - drag.t) / 1000, 0.001);
    pageVel = -(e.clientY - drag.last) / scale / dt;
    drag.last = e.clientY; drag.t = now;
  });
  const endDrag = e => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (e.type === 'pointerup' && !d.moved) handle('tap', d.pos);
    else if (performance.now() - d.t > 80) pageVel = 0; // held still before letting go
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => {
    if (!scrolls()) return;
    e.preventDefault();
    pageVel = 0; pageScroll = clamp(pageScroll + e.deltaY / scale, 0, pageMax);
  }, { passive: false });
  const KEYS = {
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
    ' ': 'confirm', Enter: 'confirm', ArrowUp: 'confirm', Escape: 'back', m: 'music', M: 'music', s: 'effects', S: 'effects',
    p: 'pause', P: 'pause', i: 'info', I: 'info', l: 'language', L: 'language',
  };
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target === nameInput || e.target === codeInput) return;
    // Up and down scroll the About page.
    const scroll = scrolls() && { ArrowUp: 'up', ArrowDown: 'down' }[e.key];
    if (scroll) { e.preventDefault(); handle(scroll); return; }
    if (e.repeat || !KEYS[e.key]) return;
    if (e.key !== 'Escape') e.preventDefault();
    handle(KEYS[e.key]);
  });

  // Leaving the page (tab switch, app switch, lost focus) pauses a running game.
  function onLeave() {
    if (state === STATE.PLAYING) pause();
    else if (state === STATE.PAUSED) resumeTimer = 0; // back to the pause menu instead of resuming unattended
  }
  // Hidden tabs throttle timers: suspend audio instead of letting the music stutter.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { onLeave(); sfx.ctx?.suspend(); } else sfx.ctx?.resume();
  });
  window.addEventListener('blur', onLeave);

  // --- Mobile app -------------------------------------------------------------
  // Inside the app's WebView (mobile/App.js) links open in the phone's browser,
  // and the app calls these hooks for the Android back button and for going to
  // the background, where the WebView does not reliably fire visibilitychange.
  const app = window.ReactNativeWebView;
  const tellApp = msg => app.postMessage(JSON.stringify(msg));
  function openLink(url) {
    if (app) tellApp({ type: 'open', url });
    else window.open(url, '_blank', 'noopener');
  }
  window.colorSpinApp = {
    // An invite or duel link that opened the app (colorspin://…).
    link(url) { if (state === STATE.SPLASH) linkQueue.push(url); else handleLink(url); },
    background() { onLeave(); sfx.ctx?.suspend(); },
    foreground() { sfx.ctx?.resume(); },
    // Back works like Esc, except that on the main menu it closes the app.
    back() {
      if (nameShown && document.activeElement === nameInput) nameInput.blur();
      else if (state === STATE.MENU) tellApp({ type: 'exit' });
      else handle('back');
    },
  };

  // --- Layout ---------------------------------------------------------------
  function resize() {
    const aw = document.body.clientWidth, ah = document.body.clientHeight;
    scale = Math.min(aw / BASE_W, ah / BASE_H);
    W = aw / scale; H = ah / scale;
    // Keep a portrait playfield on wide desktop windows.
    if (W > H * 0.75) W = H * 0.75;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = `${W * scale}px`; canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
  }
  new ResizeObserver(resize).observe(document.body);
  resize();
  for (let i = 0; i < DOT_COUNT; i++) dots.push({ x: Math.random() * W, y: Math.random() * H, r: rand(1, 3) });

  // --- Update ---------------------------------------------------------------
  function update(dt) {
    time += dt;
    fade = Math.max(fade - dt * 3, 0);
    for (const d of dots) {
      d.y -= (6 + d.r * 8) * dt;
      if (d.y < -10) { d.x = Math.random() * W; d.y = H + 10; }
    }
    if (state === STATE.PAUSED) { updatePaused(dt); return; }
    shake = Math.max(shake - dt * 30, 0);
    flash = Math.max(flash - dt * 2.5, 0);
    scorePop = Math.max(scorePop - dt * 4, 0);
    comboPop = Math.max(comboPop - dt * 2, 0);
    comboFlash = Math.max(comboFlash - dt * 3, 0);
    kick = Math.max(kick - dt * 5, 0);
    if (milestone && (milestone.t -= dt * 1.2) <= 0) milestone = null;
    if (comboLost && (comboLost.t -= dt) <= 0) comboLost = null;
    bannerTime = Math.max(bannerTime - dt, 0);
    if (toast && (toast.time -= dt) <= 0) toast = null;
    if (social.removing && (social.removing.time -= dt) <= 0) social.removing = null;
    if (awardQueue.length && (awardQueue[0].time -= dt) <= 0) { awardQueue.shift(); if (awardQueue.length) sfx.play('figure'); }
    modeFlash = modeFlash > 0 ? Math.max(modeFlash - dt * 5, 0) : Math.min(modeFlash + dt * 5, 0);
    if (pageVel && !drag) {
      // A flick keeps the About page going for a moment.
      pageScroll = clamp(pageScroll + pageVel * dt, 0, pageMax);
      pageVel *= Math.exp(-4 * dt);
      if (Math.abs(pageVel) < 5 || pageScroll === 0 || pageScroll === pageMax) pageVel = 0;
    }
    arrowFlash = arrowFlash.map(v => Math.max(v - dt * 4, 0));
    worldX = W / 2 + rand(-1, 1) * shake;
    worldY = H / 2 + rand(-1, 1) * shake;

    shape.update(dt);
    const k = slowTime > 0 ? SLOW_FACTOR : 1;
    for (const b of balls) {
      b.trail.unshift([b.x, b.y]);
      while (b.trail.length > trailLen()) b.trail.pop();
      b.x += b.vx * dt * k; b.y += b.vy * dt * k;
      if (b.switchAt && Math.hypot(b.x, b.y) < b.switchAt) {
        b.switchAt = 0;
        b.ci = b.switchTo;
        b.color = PALETTE[b.ci];
        burst(b.x, b.y, b.color, 8, 160); sfx.play('switch');
      }
    }
    updateFx(dt);

    if (state === STATE.SPLASH) {
      splashTime += dt;
      if (!splashBurst && splashTime >= SPLASH_SNAP) {
        // The last piece snaps in: a ring and a burst of every color.
        splashBurst = true;
        ring(0, SPLASH_Y, WHITE, 70, 460, 0.7);
        for (const c of PALETTE) burst(0, SPLASH_Y, c, 6, 460);
      }
      if (splashTime >= SPLASH_TIME) goToMenu();
    } else if ([STATE.MENU, STATE.LEADERBOARD, STATE.ABOUT, STATE.SETTINGS].includes(state)) {
      menuTurnTimer -= dt;
      if (menuTurnTimer <= 0) { shape.rotateStep(); menuTurnTimer = 0.9; }
    } else if (state === STATE.PLAYING) {
      playTime += dt;
      while (ghostRec.length <= Math.floor(playTime) && ghostRec.length < 1800) ghostRec.push(score);
      spawnTimer -= dt * k;
      if (hint && (hint.time -= dt) <= 0) hint = null;
      if (slowTime > 0 && (slowTime -= dt) <= 0) { slowTime = 0; music.setSlow(false); }
      if (balls.length >= maxBalls()) spawnTimer = Math.max(spawnTimer, 0.4);
      else if (spawnTimer <= 0) { spawnBall(); spawnTimer = spawnInterval(); }
      checkHits();
      if (mode === 'sprint' && state === STATE.PLAYING) {
        // The clock runs slower in slow motion too; a tick for each of the last 5 seconds.
        const before = Math.ceil(clock);
        clock = Math.max(clock - dt * k, 0);
        if (clock <= 0) gameOver();
        else if (Math.ceil(clock) < before && clock < 5) sfx.play('click');
      }
    } else {
      gameOverTime += dt;
    }
  }

  // Everything in play is frozen; only the overlay and the resume countdown move.
  function updatePaused(dt) {
    pauseTime += dt;
    if (resumeTimer <= 0) return;
    const beat = Math.ceil(resumeTimer / RESUME_BEAT);
    resumeTimer -= dt;
    if (resumeTimer <= 0) { resumeTimer = 0; state = STATE.PLAYING; music.setDucked(false); }
    else if (Math.ceil(resumeTimer / RESUME_BEAT) < beat) sfx.play('click');
  }

  // --- Drawing --------------------------------------------------------------
  function circle(x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(BG_TOP)); g.addColorStop(1, rgba(BG_BOTTOM));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const d of dots) circle(d.x, d.y, d.r, `rgba(255,255,255,${0.04 + d.r * 0.03})`);
    if (state === STATE.SPLASH) return; // the opening has only the stars
    for (let i = 0; i < 6; i++) circle(worldX, worldY, 150 + i * 35, 'rgba(255,255,255,0.012)');
    ctx.save();
    ctx.setLineDash([10, 10]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    for (const [dx, dy] of SPAWN_DIRS) {
      const far = Math.abs(dx) * W / 2 + Math.abs(dy) * H / 2;
      ctx.beginPath();
      ctx.moveTo(worldX + dx * 195, worldY + dy * 195);
      ctx.lineTo(worldX + dx * far, worldY + dy * far);
      ctx.stroke();
    }
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    const segs = 24;
    for (let i = 0; i < segs; i++) {
      const a = time * 0.25 + i * TAU / segs;
      ctx.beginPath(); ctx.arc(worldX, worldY, 178, a, a + TAU / segs * 0.5); ctx.stroke();
    }
  }

  // The rainbow ball cycles through the colors of the shape.
  const jollyColor = b => shape.colors[Math.floor(time * 8 + b.ci) % shape.sides];

  function drawBalls() {
    for (const b of balls) {
      const x = worldX + b.x, y = worldY + b.y;
      const c = b.kind === 'jolly' ? jollyColor(b) : b.color;
      const len = trailLen();
      b.trail.forEach(([tx, ty], i) => trailPiece(look.trail, worldX + tx, worldY + ty, i, len, c));
      circle(x, y, BALL_RADIUS * 2, rgba(c, 0.07));
      circle(x, y, BALL_RADIUS * 1.45, rgba(c, 0.15));
      if (!b.kind) {
        circle(x, y, BALL_RADIUS, rgba(c));
        if (symbolsOn) drawSymbol(SYMBOLS[b.ci], x, y, 11, rgba(INK, 0.85));
        else circle(x - 5, y - 5, BALL_RADIUS * 0.35, 'rgba(255,255,255,0.45)');
        continue;
      }
      drawSpecial(b, x, y, c);
    }
  }

  function drawSpecial(b, x, y, c) {
    // A pulsing white ring tells a special ball apart.
    ctx.beginPath(); ctx.arc(x, y, BALL_RADIUS + 7 + 2 * Math.sin(time * 10), 0, TAU);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    if (b.kind === 'jolly') {
      const n = shape.sides;
      for (let i = 0; i < n; i++) {
        const a = time * 5 + i * TAU / n;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, BALL_RADIUS, a, a + TAU / n); ctx.closePath();
        ctx.fillStyle = rgba(shape.colors[i]); ctx.fill();
      }
      circle(x, y, 5, 'rgba(255,255,255,0.9)');
      return;
    }
    circle(x, y, BALL_RADIUS, rgba(c));
    if (symbolsOn) {
      drawSymbol(SYMBOLS[b.ci], x, y, 11, rgba(INK, 0.85));
      if (b.kind === 'chameleon' && !b.switchAt) return;
      // Its own icon moves to a badge at the top right.
      x += 15; y -= 15;
      circle(x, y, 9, rgba(INK, 0.9));
    }
    const s = symbolsOn ? 4.5 : 7;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    if (b.kind === 'heart') {
      ctx.moveTo(x, y + s);
      ctx.bezierCurveTo(x - s * 1.7, y - s * 0.1, x - s * 0.7, y - s * 1.4, x, y - s * 0.45);
      ctx.bezierCurveTo(x + s * 0.7, y - s * 1.4, x + s * 1.7, y - s * 0.1, x, y + s);
      ctx.fill();
    } else if (b.kind === 'slow') {
      ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.lineTo(x + s, y + s);
      ctx.closePath(); ctx.fill();
    } else if (b.kind === 'chameleon' && b.switchAt) {
      // Dashes spinning around it until it changes color.
      ctx.save();
      ctx.setLineDash([5, 5]); ctx.lineDashOffset = -time * 40;
      ctx.arc(x, y, symbolsOn ? 6 : BALL_RADIUS - 5, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = symbolsOn ? 2 : 3; ctx.stroke();
      ctx.restore();
    } else {
      circle(x - 5, y - 5, BALL_RADIUS * 0.35, 'rgba(255,255,255,0.45)');
    }
  }

  // Text with a soft drop shadow; align 'left' draws from x, 'center' centers on x.
  function text(x, y, str, size, color, alpha = 1, align = 'left') {
    ctx.font = `800 ${Math.round(size)}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`; ctx.fillText(str, x, y + 4);
    ctx.fillStyle = rgba(color, alpha); ctx.fillText(str, x, y);
  }
  const centered = (str, y, size, color, alpha = 1) => text(W / 2, y, str, size, color, alpha, 'center');

  function roundRect(r, rad) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(r.x, r.y, r.w, r.h, rad); return; }
    ctx.moveTo(r.x + rad, r.y);
    ctx.arcTo(r.x + r.w, r.y, r.x + r.w, r.y + r.h, rad);
    ctx.arcTo(r.x + r.w, r.y + r.h, r.x, r.y + r.h, rad);
    ctx.arcTo(r.x, r.y + r.h, r.x, r.y, rad);
    ctx.arcTo(r.x, r.y, r.x + r.w, r.y, rad);
    ctx.closePath();
  }

  function button(r, label, bg, bgAlpha, fg) {
    ctx.save();
    roundRect(r, r.h / 2);
    if (bgAlpha >= 1) { ctx.shadowColor = rgba(bg, 0.35); ctx.shadowBlur = 28; }
    ctx.fillStyle = rgba(bg, bgAlpha); ctx.fill();
    ctx.restore();
    if (bgAlpha < 1) { ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; roundRect(r, r.h / 2); ctx.stroke(); }
    // Long labels (translations) shrink to fit.
    let fs = Math.round(r.h * 0.4);
    ctx.font = `800 ${fs}px ${FONT}`;
    while (fs > 14 && ctx.measureText(label).width > r.w - 36) ctx.font = `800 ${--fs}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(fg); ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + fs * 0.05);
  }

  // A button with a small second line under its label.
  // --- The opening -----------------------------------------------------------
  // The eight pieces of the octagon fly in spinning and lock together; then the
  // title drops in letter by letter, and the author's name signs it off.
  const SPLASH_Y = -130, SPLASH_R = 150, SPLASH_SNAP = 0.95; // center offset, radius, when it closes
  const easeOut = t => 1 - (1 - t) ** 3;
  function splashPiece(cx, cy, a0, a1, r, c, alpha) {
    const p0 = [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r], p1 = [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r];
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(cx, cy, (p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
    g.addColorStop(0, rgba(darkened(c, 0.5))); g.addColorStop(1, rgba(c));
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]);
    ctx.strokeStyle = rgba(lightened(c, 0.35)); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function drawSplash() {
    const t = splashTime, cx = worldX, cy = worldY + SPLASH_Y, n = 8, st = TAU / n;
    // The logo: one spin that slows down while the pieces arrive.
    const rot = -TAU * 0.6 * (1 - easeOut(clamp(t / 1.2, 0, 1))) - Math.PI / 2 - st / 2;
    const closed = clamp((t - SPLASH_SNAP) / 0.4, 0, 1);
    if (closed > 0) {
      for (const [k, a] of [[1.25, 0.06], [1.12, 0.1]]) {
        for (let i = 0; i < n; i++) {
          ctx.beginPath(); ctx.moveTo(cx, cy);
