          font-family: Montserrat, "Arial Black", Arial, sans-serif; font-weight: 800; color: #fff;
          background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.3);

<canvas id="game" tabindex="0"></canvas>
<input id="name" maxlength="14" autocomplete="nickname" enterkeyhint="done">

<script>
(() => {
  // Color Spin. This page is the game: it runs as the claude.ai artifact, on
  // GitHub Pages and inside the mobile app (mobile/, a WebView). It started as
  // a port of the Godot project, now archived in godot/.
  // Music is scheduled with Web Audio start times. On claude.ai the leaderboard
  // is the artifact's shared db with the account names; elsewhere it is the
  // global one (server/, a Cloudflare Worker) with a typed name, or a local
  // top 10 when offline. Saved settings live in localStorage.
  // Logical resolution 720x1280, stretched to fill the screen.
  const BASE_W = 720, BASE_H = 1280;
  const TAU = Math.PI * 2;

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const PALETTE = ['#ff4d6d', '#4dabf7', '#ffd43b', '#51cf66', '#b197fc', '#ff922b', '#3bc9db', '#f783ac'].map(hex);
  const BG_TOP = hex('#1c1638'), BG_BOTTOM = hex('#08080f'), INK = hex('#12121c');
  const WHITE = [1, 1, 1];
  const MAX_LIVES = 5, POINTS_PER_LEVEL = 10, LEVELS_PER_SIDE = 3;
  const MIN_SIDES = 3, MAX_SIDES = 8, MENU_SIDES = 6, DOT_COUNT = 40;
  const SPAWN_DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  const SHAPE_RADIUS = 120, TURN_TIME = 0.12;
  const BALL_RADIUS = 16, TRAIL_LEN = 12;
  const FONT = 'Montserrat, "Arial Black", Arial, sans-serif';
  const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAME_OVER: 3, LEADERBOARD: 4, ABOUT: 5, SETTINGS: 6 };
  const SAVE_KEY = 'color-spin-best', MUTE_KEY = 'color-spin-muted', MUSIC_KEY = 'color-spin-music-muted', NAME_KEY = 'color-spin-name';
  const VERSION = '1.2';
  const SITE_URL = 'https://espertini.com', SITE_LABEL = 'espertini.com', LANG_KEY = 'color-spin-lang';
  // All the game's texts. The texts of the online leaderboard are used only on claude.ai.
  const TEXT = {
    "it": {
      "lang_name": "ITALIANO",
      "tagline_1": "Tocca a sinistra o a destra per ruotare",
      "tagline_2": "e abbina il colore delle palline",
      "play": "GIOCA",
      "leaderboard": "CLASSIFICA",
      "best": "RECORD  %d",
      "hud_level": "LIVELLO %d",
      "banner_level": "Livello %d",
      "banner_life": "Livello %d  +1 vita",
      "game_over": "GAME OVER",
      "points_level": "PUNTI  ·  LIVELLO %d",
      "new_best": "NUOVO RECORD!",
      "rank": "%d° IN CLASSIFICA",
      "replay": "RIGIOCA",
      "menu": "MENU",
      "paused": "PAUSA",
      "pause_stats": "%d PUNTI  ·  LIVELLO %d",
      "resume": "RIPRENDI",
      "top_local": "I 10 migliori punteggi su questo dispositivo",
      "no_scores": "Ancora nessun punteggio: gioca una partita!",
      "tap_back": "Tocca per tornare al menu",
      "version": "Versione %s",
      "row_level": "liv. %d",
      "name_hint": "Scrivi il tuo nome",
      "settings": "IMPOSTAZIONI",
      "music": "MUSICA",
      "sounds": "SUONI",
      "language": "LINGUA",
      "on": "SÌ",
      "off": "NO",
      "back": "INDIETRO",
      "about": [
        [
          "COME SI GIOCA",
          [
            "Ruota la figura: ogni pallina deve",
            "toccare il lato del suo colore.",
            "Ogni 10 punti sali di livello.",
            "Ogni 3 livelli arriva un lato in più",
            "e recuperi una vita.",
            "Dopo 5 errori la partita finisce."
          ]
        ],
        [
          "COMANDI",
          [
            "Tocca a sinistra o a destra per ruotare",
            "Tastiera: frecce oppure A e D",
            "P o Esc pausa  ·  M musica  ·  S suoni"
          ]
        ],
        [
          "CREDITI",
          [
            "Un gioco di Davide Dex Espertini",
            "Fatto in JavaScript: grafica, suoni",
            "e musica sono generati dal codice"
          ]
        ]
      ],
      "top_online": "I 10 migliori giocatori",
      "top_world": "I 10 migliori al mondo",
      "loading": "Caricamento…",
      "sign_in": "Accedi per entrare in classifica",
      "player": "Giocatore",
      "you": " (tu)",
      "name_label": "Il tuo nome in classifica",
      "aria": "Color Spin. Tocca a sinistra o a destra, oppure usa le frecce, per ruotare la figura. P o Esc per la pausa, M per la musica, S per i suoni, L per la lingua, I per le informazioni."
    },
    "en": {
      "lang_name": "ENGLISH",
      "tagline_1": "Tap left or right to spin",
      "tagline_2": "and match the color of the balls",
      "play": "PLAY",
      "leaderboard": "LEADERBOARD",
      "best": "BEST  %d",
      "hud_level": "LEVEL %d",
      "banner_level": "Level %d",
      "banner_life": "Level %d  +1 life",
      "game_over": "GAME OVER",
      "points_level": "POINTS  ·  LEVEL %d",
      "new_best": "NEW BEST!",
      "rank": "RANKED #%d",
      "replay": "PLAY AGAIN",
      "menu": "MENU",
      "paused": "PAUSED",
      "pause_stats": "%d POINTS  ·  LEVEL %d",
      "resume": "RESUME",
      "top_local": "Top 10 scores on this device",
      "no_scores": "No scores yet: play a game!",
      "tap_back": "Tap to go back to the menu",
      "version": "Version %s",
      "row_level": "lv. %d",
      "name_hint": "Type your name",
      "settings": "SETTINGS",
      "music": "MUSIC",
      "sounds": "SOUNDS",
      "language": "LANGUAGE",
      "on": "ON",
      "off": "OFF",
      "back": "BACK",
      "about": [
        [
          "HOW TO PLAY",
          [
            "Spin the shape so every ball",
            "hits the side of its own color.",
            "Every 10 points you level up.",
            "Every 3 levels the shape gains a side",
            "and you get a life back.",
            "After 5 misses the game is over."
          ]
        ],
        [
          "CONTROLS",
          [
            "Tap left or right to spin",
            "Keyboard: arrows or A and D",
            "P or Esc pause  ·  M music  ·  S sounds"
          ]
        ],
        [
          "CREDITS",
          [
            "A game by Davide Dex Espertini",
            "Made in JavaScript: graphics, sounds",
            "and music are generated in code"
          ]
        ]
      ],
      "top_online": "Top 10 players",
      "top_world": "Top 10 worldwide",
      "loading": "Loading…",
      "sign_in": "Sign in to join the leaderboard",
      "player": "Player",
      "you": " (you)",
      "name_label": "Your name on the leaderboard",
      "aria": "Color Spin. Tap left or right, or use the arrow keys, to spin the shape. P or Esc to pause, M for music, S for sounds, L for language, I for info."
    }
  };
  const LANGS = Object.keys(TEXT);
  // Italian for Italian browsers, English everywhere else, until the player picks.
  let lang = (() => { try { return localStorage.getItem(LANG_KEY); } catch { return null; } })();
  if (!TEXT[lang]) lang = (navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en';
  const tr = (key, ...args) => { let i = 0; return TEXT[lang][key].replace(/%[ds]/g, () => args[i++]); };
  const NAME_ROW = 84; // extra room the name field takes on the game over screen
  const TOP_SIZE = 10;
  const RESUME_BEATS = 3, RESUME_BEAT = 0.5; // "3, 2, 1" countdown before play resumes

  const rgba = (c, a = 1) => `rgba(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0},${a})`;
  const darkened = (c, k) => c.map(v => v * (1 - k));
  const lightened = (c, k) => c.map(v => v + (1 - v) * k);
  const fposmod = (x, m) => ((x % m) + m) % m;
  const angleDiff = (from, to) => fposmod(to - from + Math.PI, TAU) - Math.PI;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
  const lerp = (a, b, t) => a + (b - a) * t;
  const backOut = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = BASE_W, H = BASE_H, scale = 1, dpr = 1;

  // --- Figure ---------------------------------------------------------------
  const shape = {
    sides: 3, colors: [], turns: 0, baseAngle: 0, rotation: 0, scale: 1,
    tween: null, pulseT: -1,
    step() { return TAU / this.sides; },
    setup(n) {
      this.sides = n; this.colors = PALETTE.slice(0, n); this.turns = 0;
      this.tween = null; this.rotation = 0; this.baseAngle = bestBaseAngle(n);
    },
    // dir: 1 = clockwise (on screen), -1 = counter-clockwise.
    rotateStep(dir = 1) {
      this.turns += dir;
      this.tween = { from: this.rotation, to: this.turns * this.step(), t: 0 };
    },
    pulse() { this.pulseT = 0; },
    update(dt) {
      if (this.tween) {
        const tw = this.tween; tw.t += dt;
        const k = Math.min(tw.t / TURN_TIME, 1);
        this.rotation = tw.from + (tw.to - tw.from) * backOut(k);
        if (k >= 1) this.tween = null;
      }
      if (this.pulseT >= 0) {
        const p = (this.pulseT += dt);
        if (p < 0.06) this.scale = 1 + 0.1 * p / 0.06;
        else if (p < 0.16) this.scale = 1.1 - 0.1 * (p - 0.06) / 0.1;
        else { this.scale = 1; this.pulseT = -1; }
      }
    },
    // Uses the logical rotation, so a turn counts immediately even while animating.
    sideAt(a) {
      const local = a - this.turns * this.step() - this.baseAngle;
      return Math.floor(fposmod(local, TAU) / this.step()) % this.sides;
    },
    edgeDistance(a) {
      const i = this.sideAt(a);
      const normal = this.baseAngle + (i + 0.5) * this.step() + this.turns * this.step();
      return SHAPE_RADIUS * Math.cos(Math.PI / this.sides) / Math.cos(angleDiff(normal, a));
    },
    draw(cx, cy) {
      const n = this.sides, st = this.step();
      const verts = [];
      for (let k = 0; k < n; k++) {
        const a = this.baseAngle + k * st;
        verts.push([Math.cos(a) * SHAPE_RADIUS, Math.sin(a) * SHAPE_RADIUS]);
      }
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(this.rotation); ctx.scale(this.scale, this.scale);
      const tri = (a, b, s) => {
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(a[0] * s, a[1] * s); ctx.lineTo(b[0] * s, b[1] * s); ctx.closePath();
      };
      for (const [s, al] of [[1.2, 0.07], [1.1, 0.14]]) {
        for (let i = 0; i < n; i++) {
          tri(verts[i], verts[(i + 1) % n], s);
          ctx.fillStyle = rgba(this.colors[i], al); ctx.fill();
        }
      }
      for (let i = 0; i < n; i++) {
        const a = verts[i], b = verts[(i + 1) % n], c = this.colors[i];
        const g = ctx.createLinearGradient(0, 0, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
        g.addColorStop(0, rgba(darkened(c, 0.5))); g.addColorStop(1, rgba(c));
        tri(a, b, 1); ctx.fillStyle = g; ctx.fill();
      }
      ctx.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const a = verts[i], b = verts[(i + 1) % n];
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
        ctx.strokeStyle = rgba(lightened(this.colors[i], 0.35)); ctx.lineWidth = 6; ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(13,13,23,0.55)'; ctx.lineWidth = 3;
      for (const v of verts) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(v[0], v[1]); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU);
      ctx.fillStyle = 'rgb(18,18,26)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    },
  };

  // Balls arrive along the 4 screen axes. Pick a vertex offset that keeps every
  // vertex (in every rotation step) as far as possible from those axes.
  function bestBaseAngle(n) {
    const step = TAU / n;
    let best = 0, bestScore = -1;
    for (let d = 0; d < 360; d++) {
      const a = (d * Math.PI / 180) * step / TAU;
      let score = Infinity;
      for (let k = 0; k < n; k++) {
        const v = fposmod(a + k * step, Math.PI / 2);
        score = Math.min(score, v, Math.PI / 2 - v);
      }
      if (score > bestScore + 0.0001) { bestScore = score; best = a; }
    }
    return best;
  }

  // --- Sound ----------------------------------------------------------------
  // Same synthesis as sfx.gd: every sound is rendered once into a buffer.
  const RATE = 22050;
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
  const sfx = {
    muted: (() => { try { return localStorage.getItem(MUTE_KEY) === '1'; } catch { return false; } })(),
    ctx: null, buffers: {}, chimes: [],
    // Browsers only allow audio after a user gesture: called from input handlers.
    unlock() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch { return; }
      const buf = samples => {
        const fade = Math.min(Math.floor(0.005 * RATE), samples.length);
        for (let i = samples.length - fade; i < samples.length; i++) samples[i] *= (samples.length - 1 - i) / fade;
        const b = this.ctx.createBuffer(1, samples.length, RATE);
        b.getChannelData(0).set(samples.map(v => clamp(v, -1, 1)));
        return b;
      };
      this.buffers.turn_left = buf(blip(540, 400, 0.06, 0.02, 0.3));
      this.buffers.turn_right = buf(blip(640, 480, 0.06, 0.02, 0.3));
      this.buffers.click = buf(blip(900, 600, 0.05, 0.015, 0.25));
      this.buffers.miss = buf(buzz(170, 60, 0.32, 0.12, 0.45));
      this.buffers.level = buf(arp([659.25, 783.99, 1046.5], 0.08, 0.3, 0.1, 0.3, 0.3));
      this.buffers.figure = buf(arp([523.25, 659.25, 783.99, 1046.5, 1318.51], 0.07, 0.35, 0.12, 0.28, 0.3));
      this.buffers.game_over = buf(arp([392, 311.13, 261.63, 196], 0.16, 0.4, 0.18, 0.35, 0.5));
      this.chimes = PENTA.map(f => buf(blip(f, f, 0.35, 0.12, 0.35, 0.3)));
      music.init(this.ctx, buf);
    },
    playBuffer(b) {
      if (this.muted || !this.ctx || !b) return;
      const src = this.ctx.createBufferSource();
      src.buffer = b; src.connect(this.ctx.destination); src.start();
    },
    play(name) { this.playBuffer(this.buffers[name]); },
    // Hit sound; `step` is the current streak, so a run of hits climbs the scale.
    chime(step) { this.playBuffer(this.chimes[clamp(step, 0, this.chimes.length - 1)]); },
  };
  const env = (t, attack, decay) => Math.min(t / attack, 1) * Math.exp(-t / decay);
  function blip(f0, f1, dur, decay, amp, harm = 0) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n);
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / RATE;
      phase += TAU * lerp(f0, f1, t / dur) / RATE;
      out[i] = (Math.sin(phase) + harm * Math.sin(2 * phase)) * amp * env(t, 0.003, decay);
    }
    return out;
  }
  function buzz(f0, f1, dur, decay, amp) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n);
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / RATE;
      phase += TAU * lerp(f0, f1, t / dur) / RATE;
      const s = Math.sin(phase) + 0.5 * Math.sin(2 * phase) + 0.33 * Math.sin(3 * phase) + rand(-0.15, 0.15);
      out[i] = s * amp * 0.6 * env(t, 0.005, decay);
    }
    return out;
  }
  function arp(freqs, gap, noteDur, decay, amp, harm) {
    const out = new Float32Array(Math.floor((gap * (freqs.length - 1) + noteDur) * RATE));
    freqs.forEach((f, k) => {
      const note = blip(f, f, noteDur, decay, amp, harm), off = Math.floor(k * gap * RATE);
      for (let i = 0; i < note.length; i++) out[off + i] += note[i];
    });
    return out;
  }
  function toggleSound() {
    sfx.muted = !sfx.muted;
    try { localStorage.setItem(MUTE_KEY, sfx.muted ? '1' : '0'); } catch {}
    sfx.play('click');
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    canvas.setAttribute('aria-label', tr('aria'));
    nameInput.placeholder = tr('name_hint');
    nameInput.setAttribute('aria-label', tr('name_label'));
  }
  function toggleLanguage() {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
    applyLanguage();
    sfx.play('click');
  }

  function toggleMusic() {
    music.muted = !music.muted;
    try { localStorage.setItem(MUSIC_KEY, music.muted ? '1' : '0'); } catch {}
    music.updateMaster();
    sfx.play('click');
  }

  // --- Music ----------------------------------------------------------------
  // Soft synth-pop in A minor / C major, same parts and numbers as music.gd.
  const STEPS_PER_BAR = 16, BARS = 4, MENU_BPM = 92, DUCKED = 0.3, OUT_GAIN = 0.5;
  const LAYER = { PAD: 0, BASS: 1, DRUMS: 2, ARP: 3, LEAD: 4, CLAP: 5 };
  // Am - F - C - G, one chord per bar (MIDI notes).
  const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];
  const ROOTS = [45, 41, 48, 43];
  const ARP_STEPS = [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 2, 1, 2, 1];
  // Lead melody over the 4 bars: step in the loop -> MIDI note.
  const LEAD = {
    0: 76, 4: 74, 6: 72, 8: 69, 12: 72, 14: 74,
    16: 72, 20: 69, 24: 72, 26: 74, 28: 76,
    32: 79, 36: 76, 38: 74, 40: 72, 44: 76, 46: 79,
    48: 74, 52: 76, 54: 74, 56: 74, 60: 71, 62: 74,
  };
  const midiFreq = m => 440 * 2 ** ((m - 69) / 12);
  const arpNote = (bar, s) => {
    const c = CHORDS[bar];
    return [c[0] + 12, c[1] + 12, c[2] + 12, c[0] + 24][ARP_STEPS[s]];
  };

  // A plucked or held note: harmonics[k] is the level of harmonic k + 1.
  function tone(f, dur, attack, decay, amp, harmonics) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n), inc = TAU * f / RATE;
    for (let i = 0; i < n; i++) {
      let v = 0;
      harmonics.forEach((h, k) => { v += h * Math.sin(inc * i * (k + 1)); });
      out[i] = v * amp * env(i / RATE, attack, decay);
    }
    return out;
  }
  // Soft chord pad: two slightly detuned oscillators for a chorus effect.
  function padChord(notes) {
    const n = Math.floor(2.8 * RATE), out = new Float32Array(n);
    for (const m of notes) {
      const i1 = TAU * midiFreq(m) / RATE, i2 = i1 * 1.004;
      for (let i = 0; i < n; i++) {
        const a = i1 * i, b = i2 * i;
        out[i] += (Math.sin(a) + 0.35 * Math.sin(2 * a) + Math.sin(b) + 0.15 * Math.sin(3 * b)) * 0.045 * env(i / RATE, 0.35, 1.6);
      }
    }
    return out;
  }
  // Lead voice with a gentle vibrato that fades in.
  function leadNote(f) {
    const n = Math.floor(0.7 * RATE), out = new Float32Array(n);
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / RATE;
      phase += TAU * f * (1 + 0.004 * Math.sin(TAU * 5.5 * t) * Math.min(t / 0.15, 1)) / RATE;
      out[i] = (Math.sin(phase) + 0.25 * Math.sin(2 * phase) + 0.1 * Math.sin(3 * phase)) * 0.14 * env(t, 0.01, 0.3);
    }
    return out;
  }
  function sweep(f0, f1, dur, decay, amp) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n);
    let phase = 0;
    for (let i = 0; i < n; i++) {
      const t = i / RATE;
      phase += TAU * lerp(f0, f1, t / dur) / RATE;
      out[i] = Math.sin(phase) * amp * env(t, 0.003, decay);
    }
    return out;
  }
  // Noise burst; `bright` keeps only the highs (hi-hat) instead of the full band (clap).
  function noise(dur, decay, amp, bright) {
    const n = Math.floor(dur * RATE), out = new Float32Array(n);
    let prev = 0;
    for (let i = 0; i < n; i++) {
      const x = rand(-1, 1);
      out[i] = (bright ? x - prev : x) * amp * env(i / RATE, 0.002, decay);
      prev = x;
    }
    return out;
  }

  const music = {
    muted: (() => { try { return localStorage.getItem(MUSIC_KEY) === '1'; } catch { return false; } })(),
    ctx: null, out: null, layers: [], targets: [0, 0, 0, 0, 0, 0], b: null,
    playing: false, ducked: false, bpm: MENU_BPM, step: 0, nextTime: 0,
    // Called once the audio context exists (after the first user gesture).
    init(ctx, buf) {
      this.ctx = ctx;
      this.out = ctx.createGain(); this.out.gain.value = 0; this.out.connect(ctx.destination);
      this.layers = this.targets.map(() => {
        const g = ctx.createGain(); g.gain.value = 0; g.connect(this.out); return g;
      });
      const b = this.b = { pad: CHORDS.map(c => buf(padChord(c))), bass: {}, arp: {}, lead: {} };
      for (const r of ROOTS) for (const m of [r, r + 12])
        b.bass[m] = buf(tone(midiFreq(m), 0.4, 0.005, 0.18, m === r ? 0.32 : 0.28, [1, 0.5, 0.25]));
      for (let bar = 0; bar < BARS; bar++) for (let s = 0; s < STEPS_PER_BAR; s++) {
        const m = arpNote(bar, s);
        b.arp[m] ||= buf(tone(midiFreq(m), 0.3, 0.002, 0.07, 0.1, [1, 0.3]));
      }
      for (const m of Object.values(LEAD)) b.lead[m] ||= buf(leadNote(midiFreq(m)));
      b.kick = buf(sweep(150, 45, 0.25, 0.12, 0.5));
      b.hat = buf(noise(0.05, 0.015, 0.07, true));
      b.clap = buf(noise(0.15, 0.05, 0.12, false));
      this.applyLayers(); this.updateMaster();
      this.nextTime = ctx.currentTime + 0.05;
      setInterval(() => this.tick(), 25);
    },
    // Calm version for the menu: pad, a little bass and the arpeggio.
    playMenu() { this.begin(); this.bpm = MENU_BPM; this.setLayers([1, 0.6, 0, 0.7, 0, 0]); },
    // One more instrument with every new figure (tier), a bit faster every level.
    playGame(lvl, t) { this.begin(); this.setLevel(lvl, t); },
    setLevel(lvl, t) {
      this.bpm = Math.min(100 + 2 * (lvl - 1), 128);
      this.setLayers([1, 1, t >= 1, t >= 2, t >= 3, t >= 4].map(Number));
    },
    setDucked(on) { this.ducked = on; this.updateMaster(); },
    // Fades out; the next play* starts again from the first bar.
    stop() { this.playing = false; this.updateMaster(); },
    begin() {
      if (!this.playing) { this.step = 0; if (this.ctx) this.nextTime = this.ctx.currentTime + 0.05; }
      this.playing = true; this.ducked = false; this.updateMaster();
    },
    setLayers(t) { this.targets = t; this.applyLayers(); },
    applyLayers() {
      if (!this.ctx) return;
      this.layers.forEach((g, i) => g.gain.setTargetAtTime(this.targets[i], this.ctx.currentTime, 0.25));
    },
    updateMaster() {
      if (!this.ctx) return;
      const v = this.muted || !this.playing ? 0 : (this.ducked ? DUCKED : 1) * OUT_GAIN;
      this.out.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2);
    },
    // Look-ahead scheduler: queues the 16ths due in the next ~120 ms.
    tick() {
      const now = this.ctx.currentTime;
      if (!this.playing || this.muted || this.nextTime < now - 0.2) {
        // Silent, or the tab was frozen: don't try to catch up.
        this.nextTime = Math.max(this.nextTime, now + 0.05);
        if (!this.playing || this.muted) return;
      }
      while (this.nextTime < now + 0.12) {
        this.trigger(this.step, this.nextTime);
        this.step = (this.step + 1) % (STEPS_PER_BAR * BARS);
        this.nextTime += 60 / this.bpm / 4;
      }
    },
    trigger(step, when) {
      const bar = Math.floor(step / STEPS_PER_BAR), s = step % STEPS_PER_BAR, b = this.b;
      if (s === 0) this.voice(b.pad[bar], LAYER.PAD, when);
      if (s % 2 === 0) this.voice(b.bass[ROOTS[bar] + (s === 6 || s === 14 ? 12 : 0)], LAYER.BASS, when);
      if (s === 0 || s === 8) this.voice(b.kick, LAYER.DRUMS, when);
      if (s % 4 === 2) this.voice(b.hat, LAYER.DRUMS, when);
      if (s === 4 || s === 12) this.voice(b.clap, LAYER.CLAP, when);
      this.voice(b.arp[arpNote(bar, s)], LAYER.ARP, when);
      if (LEAD[step]) this.voice(b.lead[LEAD[step]], LAYER.LEAD, when);
    },
    // Silent layers don't start new notes.
    voice(buffer, layer, when) {
      if (this.targets[layer] <= 0 && this.layers[layer].gain.value < 0.001) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buffer; src.connect(this.layers[layer]); src.start(when);
    },
  };

  // --- Leaderboard ----------------------------------------------------------
  // Online on claude.ai: one document per player, scores/<user id> =
  // {score, level, at}; names are resolved from the id at render time, never
  // stored. Anywhere else (GitHub Pages, the app) it is the global board of
  // server/, with a local top 10 in localStorage while offline.
  const LOCAL_KEY = 'color-spin-top';
  const board = {
    status: 'loading', // loading | ready (claude.ai) | global | local
    rows: [],          // what the leaderboard shows, sorted, top TOP_SIZE
    localRows: (() => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; } })(),
    names: {},
    myId: null, myBest: 0, db: null, user: null, writing: Promise.resolve(),
    localHighlight: -1, // row of the last local game, -1 = none
    me: null,           // global board: {rank, name, score, level} of this device's player
  };
  function useLocalBoard() {
    board.status = 'local';
    board.rows = board.localRows;
  }
  // Inserts this game into the local top list; returns its rank (0 = not ranked).
  function recordLocal(s, lvl) {
    board.localHighlight = -1;
    if (s <= 0) return 0;
    let i = 0;
    const rows = board.localRows;
    while (i < rows.length && rows[i].score >= s) i++;
    if (i >= TOP_SIZE) return 0;
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    rows.splice(i, 0, { id: `local-${Date.now()}`, score: s, level: lvl, name: playerName,
      date: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` });
    rows.length = Math.min(rows.length, TOP_SIZE);
    saveLocalBoard();
    board.localHighlight = i;
    return i + 1;
  }
  function saveLocalBoard() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(board.localRows)); } catch {}
  }

  // --- Name field (local leaderboard only) ------------------------------------
  // A real <input> over the canvas, so phones bring up their keyboard.
  const nameInput = document.getElementById('name');
  let playerName = (() => { try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; } })();
  let nameShown = false;
  nameInput.addEventListener('input', () => {
    playerName = nameInput.value.trim();
    try { localStorage.setItem(NAME_KEY, playerName); } catch {}
    if (board.localHighlight >= 0) { board.localRows[board.localHighlight].name = playerName; saveLocalBoard(); }
    if (board.status === 'global') {
      net.nameDirty = true;
      clearTimeout(net.nameTimer); net.nameTimer = setTimeout(syncGlobal, 1200);
    }
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') nameInput.blur(); });
  function showNameInput() {
    nameInput.value = playerName; nameShown = true;
    nameInput.style.display = 'block'; nameInput.style.opacity = '0';
  }
  function hideNameInput() {
    if (!nameShown) return;
    nameShown = false; nameInput.blur(); nameInput.style.display = 'none';
  }
  // Right under the rank line; the buttons move down to make room for it.
  const nameField = () => ({ x: W / 2 - 170, y: H * 0.62 - 6, w: 340, h: 66 });
  function placeNameInput(alpha) {
    const c = canvas.getBoundingClientRect(), f = nameField();
    Object.assign(nameInput.style, {
      left: `${c.left + f.x * scale}px`, top: `${c.top + f.y * scale}px`,
      width: `${f.w * scale}px`, height: `${f.h * scale}px`,
      fontSize: `${30 * scale}px`, borderRadius: `${20 * scale}px`, padding: `0 ${20 * scale}px`,
      opacity: String(alpha),
    });
  }

  async function initBoard() {
    const cl = window.claude;
    const [db, user] = cl && cl.use ? await Promise.all([cl.use('db'), cl.use('user')]) : [null, null];
    if (!db) { useLocalBoard(); refreshGlobal(); syncGlobal(); return; }
    board.db = db; board.user = user;
    board.myId = user ? await user.id() : null;
    if (board.myId) {
      try {
        const snap = await db.doc(`scores/${board.myId}`).get();
        if (snap.exists) board.myBest = Number(snap.data().score) || 0;
      } catch {}
    }
    db.collection('scores').orderBy('score', 'desc').limit(TOP_SIZE).onSnapshot(snap => {
      board.rows = snap.docs.map(d => ({ id: d.id, score: Number(d.data().score) || 0, level: Number(d.data().level) || 1 }));
      board.status = 'ready';
      refreshNames();
    }, () => { if (board.status === 'loading') useLocalBoard(); });
  }
  async function refreshNames() {
    if (!board.user || !board.rows.length) return;
    const ps = await board.user.profiles(board.rows.map(r => r.id));
    for (const id in ps) board.names[id] = ps[id].name;
  }
  function submitScore(s, lvl) {
    if (!board.db || !board.myId || s <= board.myBest) return;
    board.myBest = s;
    // One write at a time to the player's document.
    board.writing = board.writing.then(() =>
      board.db.doc(`scores/${board.myId}`).set({ score: s, level: lvl, at: Date.now() })
    ).catch(() => {});
  }
  // Position this score would take among the other players (0 = outside the top).
  function onlineRank(s) {
    if (board.status !== 'ready' || s <= 0) return 0;
    const better = board.rows.filter(r => r.id !== board.myId && r.score > s).length;
    return better < TOP_SIZE ? better + 1 : 0;
  }

  // --- Global leaderboard (server/) ---------------------------------------------
  // Each device is an anonymous player with a random id; the server keeps its
  // best game and its name. A game that could not be sent (offline) waits in
  // localStorage and goes out with the next successful sync.
  const SCORES_URL = 'https://scores.espertini.com/v1/scores';
  const PLAYER_KEY = 'color-spin-player', PENDING_KEY = 'color-spin-pending';
  const RETRY_GAP = 2500; // the server takes one write every 2 s per player
  const net = {
    player: (() => {
      try {
        let id = localStorage.getItem(PLAYER_KEY);
        if (!/^[0-9a-f]{32}$/.test(id || '')) {
          id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
          localStorage.setItem(PLAYER_KEY, id);
        }
        return id;
      } catch { return null; }
    })(),
    pending: (() => { try { return JSON.parse(localStorage.getItem(PENDING_KEY)); } catch { return null; } })(),
    lastGame: null, nameDirty: false, nameTimer: 0, busy: false,
  };
  const savePending = () => {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(net.pending)); } catch {}
  };
  function applyGlobal(data) {
    if (!data || !Array.isArray(data.top)) return;
    board.status = 'global';
    board.rows = data.top.map(r => ({ name: r.name, score: r.score, level: r.level, mine: !!r.you }));
    board.me = data.me;
  }
  async function refreshGlobal() {
    if (!net.player) return;
    try {
      const res = await fetch(`${SCORES_URL}?player=${net.player}`);
      if (res.ok) applyGlobal(await res.json());
    } catch {} // offline: the local board stays
  }
  // Queues a finished game for the global board (only if it beats the player's best).
  function submitGlobal(s, lvl, duration) {
    if (!net.player || s <= 0 || s <= (board.me?.score || 0) || s <= (net.pending?.score || 0)) return false;
    net.pending = net.lastGame = { score: s, level: lvl, duration: Math.round(duration * 10) / 10 };
    savePending();
    syncGlobal();
    return true;
  }
  // Sends the waiting game, or just the name when that changed.
  async function syncGlobal() {
    if (net.busy || !net.player) return;
    const game = net.pending;
    if (!game && !net.nameDirty) return;
    net.busy = true; net.nameDirty = false;
    let retry = false, offline = false;
    try {
      const res = await fetch(SCORES_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ player: net.player, name: playerName, ...(game || { score: 0, level: 1, duration: 0 }) }),
      });
      if (res.status === 429) { retry = true; if (!game) net.nameDirty = true; }
      else {
        if (res.ok) {
          applyGlobal(await res.json());
          if (game && game === net.lastGame && state === STATE.GAME_OVER && board.me) lastRank = board.me.rank;
        }
        // Sent, or refused by the server (it would be refused again): either way it's done.
        if (res.ok || res.status < 500) { if (net.pending === game) { net.pending = null; savePending(); } }
      }
    } catch {
      offline = true;
      if (!game) net.nameDirty = true; // try again with the next game or launch
    } finally {
      net.busy = false;
    }
    // Rate limited, or a new game or name came in meanwhile.
    if (retry || (!offline && ((net.pending && net.pending !== game) || net.nameDirty))) {
      setTimeout(syncGlobal, RETRY_GAP);
    }
  }

  // --- Effects --------------------------------------------------------------
  let particles = [], rings = [], texts = [];
  function burst(x, y, color, count = 14, speed = 280) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU, sp = speed * rand(0.3, 1), life = rand(0.35, 0.7);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, color, size: rand(3, 7), life, max: life });
    }
  }
  const ring = (x, y, color, from, to, dur = 0.35) => rings.push({ x, y, color, from, to, life: dur, max: dur });
  const floatText = (x, y, text, color) => texts.push({ x, y, text, color, life: 0.7, max: 0.7 });
  const clearFx = () => { particles = []; rings = []; texts = []; };

  function updateFx(dt) {
    for (const p of particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const drag = Math.max(1 - 3 * dt, 0); p.vx *= drag; p.vy *= drag;
    }
    for (const r of rings) r.life -= dt;
    for (const t of texts) { t.life -= dt; t.y -= 70 * dt; }
    particles = particles.filter(p => p.life > 0);
    rings = rings.filter(r => r.life > 0);
    texts = texts.filter(t => t.life > 0);
  }

  function drawFx(ox, oy) {
    for (const r of rings) {
      const t = 1 - r.life / r.max;
      ctx.beginPath(); ctx.arc(ox + r.x, oy + r.y, lerp(r.from, r.to, 1 - (1 - t) ** 3), 0, TAU);
      ctx.strokeStyle = rgba(r.color, 1 - t); ctx.lineWidth = 1 + 5 * (1 - t); ctx.stroke();
    }
    for (const p of particles) {
      const t = p.life / p.max;
      ctx.beginPath(); ctx.arc(ox + p.x, oy + p.y, p.size * t, 0, TAU);
      ctx.fillStyle = rgba(p.color, t); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `800 34px ${FONT}`;
    for (const t of texts) {
      ctx.fillStyle = rgba(t.color, clamp(t.life / t.max * 2, 0, 1));
      ctx.fillText(t.text, ox + t.x, oy + t.y);
    }
  }

  // --- Game state -----------------------------------------------------------
  let state = STATE.MENU, score = 0, best = loadBest(), newBest = false;
  let lives = MAX_LIVES, level = 1, spawnTimer = 0, menuTurnTimer = 0;
  let shake = 0, flash = 0, fade = 0, scorePop = 0, banner = '', bannerTime = 0;
  let gameOverTime = 0, pauseTime = 0, resumeTimer = 0, time = 0, worldX = 0, worldY = 0;
  let streak = 0, arrowFlash = [0, 0], lastRank = 0, lastGameImproved = false, playTime = 0;
  let balls = [];
  let dots = [];

  function loadBest() {
    try { return parseInt(localStorage.getItem(SAVE_KEY), 10) || 0; } catch { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem(SAVE_KEY, String(best)); } catch {}
  }

  function goToMenu() {
    hideNameInput();
    balls = []; clearFx();
    state = STATE.MENU; shape.setup(MENU_SIDES); menuTurnTimer = 1; fade = 1;
    music.playMenu();
  }

  function start() {
    hideNameInput();
    balls = []; clearFx();
    score = 0; lives = MAX_LIVES; level = 1; newBest = false; spawnTimer = 1;
    streak = 0; lastRank = 0; lastGameImproved = false; playTime = 0;
    state = STATE.PLAYING; fade = 1;
    shape.setup(sidesForLevel(level));
    music.playGame(level, tier(level));
    showBanner(tr('banner_level', 1));
  }

  const tier = lvl => Math.min(Math.floor((lvl - 1) / LEVELS_PER_SIDE), MAX_SIDES - MIN_SIDES);
  const sidesForLevel = lvl => MIN_SIDES + tier(lvl);
  function difficulty() {
    const t = tier(level);
    return 0.7 * t + 0.5 * (level - 1 - t * LEVELS_PER_SIDE);
  }
  const travelTime = () => Math.max(1, 3.2 - 0.25 * difficulty());
  const spawnInterval = () => Math.max(0.5, 2 - 0.18 * difficulty());
  const maxBalls = () => Math.min(level, 3 + tier(level));
  const showBanner = text => { banner = text; bannerTime = 1.2; };

  function spawnBall() {
    const [dx, dy] = SPAWN_DIRS[Math.random() * 4 | 0];
    const dist = Math.abs(dx) * W / 2 + Math.abs(dy) * H / 2 + BALL_RADIUS;
    const ci = Math.random() * shape.sides | 0;
    const v = (dist - SHAPE_RADIUS) / travelTime();
    // Same travel time from every edge, so a portrait screen stays fair.
    balls.push({ ci, color: PALETTE[ci], x: dx * dist, y: dy * dist, vx: -dx * v, vy: -dy * v, trail: [] });
  }

  function checkHits() {
    for (const b of balls) {
      if (b.dead) continue;
      const angle = Math.atan2(b.y, b.x);
      if (Math.hypot(b.x, b.y) - BALL_RADIUS > shape.edgeDistance(angle)) continue;
      b.dead = true;
      if (shape.sideAt(angle) === b.ci) onScore(b); else onMiss(b);
      if (state !== STATE.PLAYING) break;
    }
    balls = balls.filter(b => !b.dead);
  }

  function onScore(b) {
    score++; scorePop = 1; shape.pulse();
    sfx.chime(streak); streak++;
    burst(b.x, b.y, b.color); ring(b.x, b.y, b.color, 10, 70);
    const len = Math.hypot(b.x, b.y) || 1;
    floatText(b.x + b.x / len * 50, b.y + b.y / len * 50, '+1', b.color);
    if (score % POINTS_PER_LEVEL === 0) levelUp();
  }

  function onMiss(b) {
    lives--; streak = 0; shake = 14; flash = 1;
    burst(b.x, b.y, [0.75, 0.75, 0.8], 10, 200); ring(b.x, b.y, PALETTE[0], 10, 90);
    if (lives <= 0) gameOver(); else sfx.play('miss');
  }

  function levelUp() {
    level++;
    music.setLevel(level, tier(level));
    const n = sidesForLevel(level);
    if (n !== shape.sides) {
      // New figure: clear the board, a moment to look at it, and a life back.
      for (const b of balls) b.dead = true;
      shape.setup(n);
      sfx.play('figure');
      ring(0, 0, WHITE, 60, 450, 0.6);
      for (const c of shape.colors) burst(0, 0, c, 6, 420);
      spawnTimer = 1.5;
      if (lives < MAX_LIVES) { lives++; showBanner(tr('banner_life', level)); return; }
    } else {
      sfx.play('level');
    }
    showBanner(tr('banner_level', level));
  }

  function pause() {
    state = STATE.PAUSED; pauseTime = 0; resumeTimer = 0;
    sfx.play('click'); music.setDucked(true);
  }

  function gameOver() {
    state = STATE.GAME_OVER; gameOverTime = 0;
    sfx.play('game_over'); music.stop();
    for (const b of balls) b.dead = true;
    for (const c of shape.colors) burst(0, 0, c, 10, 450);
    if (score > best) { best = score; newBest = true; saveBest(); }
    if (board.status === 'ready') {
      lastGameImproved = board.myId !== null && score > board.myBest;
      lastRank = lastGameImproved ? onlineRank(score) : 0;
      submitScore(score, level);
      return;
    }
    // The local top 10 keeps every game, for when the device is offline.
    const localRank = recordLocal(score, level);
    const queued = submitGlobal(score, level, playTime);
    if (board.status === 'global') {
      // The global rank shows up when the server answers.
      lastGameImproved = queued; lastRank = 0;
      if (queued) showNameInput();
    } else {
      lastRank = localRank;
      if (lastRank > 0) showNameInput();
    }
  }

  // --- Input ----------------------------------------------------------------
  const menuButtons = () => [
    { x: W / 2 - 160, y: H * 0.77 - 48, w: 320, h: 96 },
    { x: W / 2 - 150, y: H * 0.77 + 64, w: 300, h: 88 },
  ];
  const settingsButton = () => ({ x: W - 92, y: 24, w: 68, h: 68 });
  // Music, sounds, language, back.
  const settingsButtons = () => [0, 1, 2, 3].map(i =>
    ({ x: W / 2 - 260, y: H * 0.3 + i * 104 + (i === 3 ? 40 : 0), w: 520, h: 84 }));
  let linkRect = { x: 0, y: 0, w: 0, h: 0 }; // the site link on the about screen, set when drawn
  const infoButton = () => ({ x: 24, y: 24, w: 68, h: 68 });
  // Top center, between the score and the lives.
  const pauseButton = () => ({ x: W / 2 - 34, y: 22, w: 68, h: 68 });
  const pauseButtons = () => [
    { x: W / 2 - 150, y: H * 0.45, w: 300, h: 88 },
    { x: W / 2 - 150, y: H * 0.45 + 108, w: 300, h: 88 },
  ];
  // Music and sound effects toggles, side by side under the pause buttons.
  const pauseAudioButtons = () => [
    { x: W / 2 - 84, y: H * 0.45 + 232, w: 68, h: 68 },
    { x: W / 2 + 16, y: H * 0.45 + 232, w: 68, h: 68 },
  ];

  const grow = (r, k) => ({ x: r.x - k, y: r.y - k, w: r.w + 2 * k, h: r.h + 2 * k });
  const gameOverButtons = () => {
    const y = H * 0.62 + (nameShown ? NAME_ROW : 0);
    return [{ x: W / 2 - 150, y, w: 300, h: 88 }, { x: W / 2 - 150, y: y + 108, w: 300, h: 88 }];
  };
  const hit = (r, p) => p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  function handle(action, pos) {
    sfx.unlock();
    if (action === 'music') { toggleMusic(); return; }
    if (action === 'effects') { toggleSound(); return; }
    if (action === 'language') { toggleLanguage(); return; }
    if (state === STATE.MENU) {
      if (action === 'tap' && hit(settingsButton(), pos)) {
        sfx.play('click'); state = STATE.SETTINGS; fade = 0.6;
      }
      else if (action === 'tap' && hit(menuButtons()[1], pos)) {
        sfx.play('click'); state = STATE.LEADERBOARD; fade = 0.6; refreshNames();
        if (board.status === 'global' || board.status === 'local') { refreshGlobal(); syncGlobal(); }
      } else if (action === 'info' || (action === 'tap' && hit(infoButton(), pos))) {
        sfx.play('click'); state = STATE.ABOUT; fade = 0.6;
      } else if (action !== 'back') start();
    } else if (state === STATE.PLAYING) {
      if (action === 'pause' || action === 'back' || (action === 'tap' && hit(grow(pauseButton(), 12), pos))) {
        pause(); return;
      }
      let dir = 0;
      if (action === 'left') dir = -1;
      else if (action === 'right' || action === 'confirm') dir = 1;
      else if (action === 'tap') dir = pos.x < W / 2 ? -1 : 1;
      if (dir) {
        shape.rotateStep(dir);
        sfx.play(dir < 0 ? 'turn_left' : 'turn_right');
        arrowFlash[dir < 0 ? 0 : 1] = 1;
      }
    } else if (state === STATE.PAUSED) {
      if (resumeTimer > 0) return;
      const b = pauseButtons();
      const audio = pauseAudioButtons();
      if (action === 'tap' && hit(audio[0], pos)) toggleMusic();
      else if (action === 'tap' && hit(audio[1], pos)) toggleSound();
      else if (['confirm', 'pause', 'back'].includes(action) || hit(b[0], pos)) {
        sfx.play('click'); resumeTimer = RESUME_BEATS * RESUME_BEAT;
      } else if (hit(b[1], pos)) {
        // Leaving mid-game: the run is dropped, not recorded.
        sfx.play('click'); goToMenu();
      }
    } else if (state === STATE.GAME_OVER) {
      if (gameOverTime < 0.6) return;
      const b = gameOverButtons();
      if (action === 'confirm' || hit(b[0], pos)) { sfx.play('click'); start(); }
      else if (action === 'back' || hit(b[1], pos)) { sfx.play('click'); goToMenu(); }
    } else if (state === STATE.SETTINGS) {
      const rows = settingsButtons();
      if (action === 'tap' && hit(rows[0], pos)) toggleMusic();
      else if (action === 'tap' && hit(rows[1], pos)) toggleSound();
      else if (action === 'tap' && hit(rows[2], pos)) toggleLanguage();
      else if (action === 'back' || (action === 'tap' && hit(rows[3], pos))) {
        sfx.play('click'); state = STATE.MENU; fade = 0.6;
      }
    } else if (state === STATE.ABOUT && action === 'tap' && hit(linkRect, pos)) {
      sfx.play('click'); openLink(SITE_URL);
    } else {
      // Any tap or key goes back: the whole screen is the "back" button.
      sfx.play('click'); state = STATE.MENU; fade = 0.6;
    }
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    const r = canvas.getBoundingClientRect();
    handle('tap', { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale });
  });
  const KEYS = {
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
    ' ': 'confirm', Enter: 'confirm', ArrowUp: 'confirm', Escape: 'back', m: 'music', M: 'music', s: 'effects', S: 'effects',
    p: 'pause', P: 'pause', i: 'info', I: 'info', l: 'language', L: 'language',
  };
  window.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || !KEYS[e.key] || e.target === nameInput) return;
    if (e.key !== 'Escape') e.preventDefault();
    handle(KEYS[e.key]);
  });

  // Leaving the page (tab switch, app switch, lost focus) pauses a running game.
  function onLeave() {
    if (state === STATE.PLAYING) pause();
    else if (state === STATE.PAUSED) resumeTimer = 0; // back to the pause menu instead of resuming unattended
  }
  // Hidden tabs throttle timers: suspend audio instead of letting the music stutter.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { onLeave(); sfx.ctx?.suspend(); } else sfx.ctx?.resume();
  });
  window.addEventListener('blur', onLeave);

  // --- Mobile app -------------------------------------------------------------
  // Inside the app's WebView (mobile/App.js) links open in the phone's browser,
  // and the app calls these hooks for the Android back button and for going to
  // the background, where the WebView does not reliably fire visibilitychange.
  const app = window.ReactNativeWebView;
  const tellApp = msg => app.postMessage(JSON.stringify(msg));
  function openLink(url) {
    if (app) tellApp({ type: 'open', url });
    else window.open(url, '_blank', 'noopener');
  }
  window.colorSpinApp = {
    background() { onLeave(); sfx.ctx?.suspend(); },
    foreground() { sfx.ctx?.resume(); },
    // Back works like Esc, except that on the main menu it closes the app.
    back() {
      if (nameShown && document.activeElement === nameInput) nameInput.blur();
      else if (state === STATE.MENU) tellApp({ type: 'exit' });
      else handle('back');
    },
  };

  // --- Layout ---------------------------------------------------------------
  function resize() {
    const aw = document.body.clientWidth, ah = document.body.clientHeight;
    scale = Math.min(aw / BASE_W, ah / BASE_H);
    W = aw / scale; H = ah / scale;
    // Keep a portrait playfield on wide desktop windows.
    if (W > H * 0.75) W = H * 0.75;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = `${W * scale}px`; canvas.style.height = `${H * scale}px`;
    canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
  }
  new ResizeObserver(resize).observe(document.body);
  resize();
  for (let i = 0; i < DOT_COUNT; i++) dots.push({ x: Math.random() * W, y: Math.random() * H, r: rand(1, 3) });

  // --- Update ---------------------------------------------------------------
  function update(dt) {
    time += dt;
    fade = Math.max(fade - dt * 3, 0);
    for (const d of dots) {
      d.y -= (6 + d.r * 8) * dt;
      if (d.y < -10) { d.x = Math.random() * W; d.y = H + 10; }
    }
    if (state === STATE.PAUSED) { updatePaused(dt); return; }
    shake = Math.max(shake - dt * 30, 0);
    flash = Math.max(flash - dt * 2.5, 0);
    scorePop = Math.max(scorePop - dt * 4, 0);
    bannerTime = Math.max(bannerTime - dt, 0);
    arrowFlash = arrowFlash.map(v => Math.max(v - dt * 4, 0));
    worldX = W / 2 + rand(-1, 1) * shake;
    worldY = H / 2 + rand(-1, 1) * shake;

    shape.update(dt);
    for (const b of balls) {
      b.trail.unshift([b.x, b.y]);
      if (b.trail.length > TRAIL_LEN) b.trail.pop();
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    updateFx(dt);

    if ([STATE.MENU, STATE.LEADERBOARD, STATE.ABOUT, STATE.SETTINGS].includes(state)) {
      menuTurnTimer -= dt;
      if (menuTurnTimer <= 0) { shape.rotateStep(); menuTurnTimer = 0.9; }
    } else if (state === STATE.PLAYING) {
      playTime += dt;
      spawnTimer -= dt;
      if (balls.length >= maxBalls()) spawnTimer = Math.max(spawnTimer, 0.4);
      else if (spawnTimer <= 0) { spawnBall(); spawnTimer = spawnInterval(); }
      checkHits();
    } else {
      gameOverTime += dt;
    }
  }

  // Everything in play is frozen; only the overlay and the resume countdown move.
  function updatePaused(dt) {
    pauseTime += dt;
    if (resumeTimer <= 0) return;
    const beat = Math.ceil(resumeTimer / RESUME_BEAT);
    resumeTimer -= dt;
    if (resumeTimer <= 0) { resumeTimer = 0; state = STATE.PLAYING; music.setDucked(false); }
    else if (Math.ceil(resumeTimer / RESUME_BEAT) < beat) sfx.play('click');
  }

  // --- Drawing --------------------------------------------------------------
  function circle(x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(BG_TOP)); g.addColorStop(1, rgba(BG_BOTTOM));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const d of dots) circle(d.x, d.y, d.r, `rgba(255,255,255,${0.04 + d.r * 0.03})`);
    for (let i = 0; i < 6; i++) circle(worldX, worldY, 150 + i * 35, 'rgba(255,255,255,0.012)');
    ctx.save();
    ctx.setLineDash([10, 10]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    for (const [dx, dy] of SPAWN_DIRS) {
      const far = Math.abs(dx) * W / 2 + Math.abs(dy) * H / 2;
      ctx.beginPath();
      ctx.moveTo(worldX + dx * 195, worldY + dy * 195);
      ctx.lineTo(worldX + dx * far, worldY + dy * far);
      ctx.stroke();
    }
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    const segs = 24;
    for (let i = 0; i < segs; i++) {
      const a = time * 0.25 + i * TAU / segs;
      ctx.beginPath(); ctx.arc(worldX, worldY, 178, a, a + TAU / segs * 0.5); ctx.stroke();
    }
  }

  function drawBalls() {
    for (const b of balls) {
      const x = worldX + b.x, y = worldY + b.y;
      b.trail.forEach(([tx, ty], i) => {
        const t = 1 - (i + 1) / (TRAIL_LEN + 1);
        circle(worldX + tx, worldY + ty, BALL_RADIUS * (0.3 + 0.6 * t), rgba(b.color, 0.22 * t));
      });
      circle(x, y, BALL_RADIUS * 2, rgba(b.color, 0.07));
      circle(x, y, BALL_RADIUS * 1.45, rgba(b.color, 0.15));
      circle(x, y, BALL_RADIUS, rgba(b.color));
      circle(x - 5, y - 5, BALL_RADIUS * 0.35, 'rgba(255,255,255,0.45)');
    }
  }

  // Text with a soft drop shadow; align 'left' draws from x, 'center' centers on x.
  function text(x, y, str, size, color, alpha = 1, align = 'left') {
    ctx.font = `800 ${Math.round(size)}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`; ctx.fillText(str, x, y + 4);
    ctx.fillStyle = rgba(color, alpha); ctx.fillText(str, x, y);
  }
  const centered = (str, y, size, color, alpha = 1) => text(W / 2, y, str, size, color, alpha, 'center');

  function roundRect(r, rad) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(r.x, r.y, r.w, r.h, rad); return; }
    ctx.moveTo(r.x + rad, r.y);
    ctx.arcTo(r.x + r.w, r.y, r.x + r.w, r.y + r.h, rad);
    ctx.arcTo(r.x + r.w, r.y + r.h, r.x, r.y + r.h, rad);
    ctx.arcTo(r.x, r.y + r.h, r.x, r.y, rad);
    ctx.arcTo(r.x, r.y, r.x + r.w, r.y, rad);
    ctx.closePath();
  }

  function button(r, label, bg, bgAlpha, fg) {
    ctx.save();
    roundRect(r, r.h / 2);
    if (bgAlpha >= 1) { ctx.shadowColor = rgba(bg, 0.35); ctx.shadowBlur = 28; }
    ctx.fillStyle = rgba(bg, bgAlpha); ctx.fill();
    ctx.restore();
    if (bgAlpha < 1) { ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; roundRect(r, r.h / 2); ctx.stroke(); }
    const fs = Math.round(r.h * 0.4);
    ctx.font = `800 ${fs}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = rgba(fg); ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + fs * 0.05);
  }

  function drawMenu() {
    const size = 104, word = 'COLOR';
    ctx.font = `800 ${size}px ${FONT}`;
    const widths = [...word].map(ch => ctx.measureText(ch).width);
    let x = (W - widths.reduce((a, b) => a + b, 0)) / 2;
    const y = H * 0.17;
    for (let i = 0; i < word.length; i++) {
      text(x, y + Math.sin(time * 3 + i * 0.7) * 6, word[i], size, PALETTE[i]);
      x += widths[i];
    }
    centered('SPIN', y + 100, size, WHITE);

    const cy = H / 2;
    centered(tr('tagline_1'), cy + 232, 24, WHITE, 0.85);
    centered(tr('tagline_2'), cy + 266, 22, WHITE, 0.5);

    const [r, lb] = menuButtons(), p = 1 + Math.sin(time * 4) * 0.03;
    const grown = { x: r.x - r.w * (p - 1) / 2, y: r.y - r.h * (p - 1) / 2, w: r.w * p, h: r.h * p };
    button(grown, tr('play'), PALETTE[2], 1, INK);
    button(lb, tr('leaderboard'), WHITE, 0.1, WHITE);
    if (best > 0) centered(tr('best', best), lb.y + lb.h + 52, 24, WHITE, 0.55);
    drawSettingsIcon(settingsButton());
    drawInfoIcon(infoButton());
  }

  // Curved arrow; dir 1 = clockwise, -1 = counter-clockwise (mirrored).
  function drawTurnArrow(cx, cy, dir, alpha) {
    const r = 34, a0 = -Math.PI * 0.85, a1 = Math.PI * 0.35;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(dir, 1);
    ctx.strokeStyle = ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.stroke();
    const tip = [Math.cos(a1) * r, Math.sin(a1) * r], tg = [-Math.sin(a1), Math.cos(a1)], sd = [-tg[1], tg[0]];
    ctx.beginPath();
    ctx.moveTo(tip[0] + tg[0] * 14, tip[1] + tg[1] * 14);
    ctx.lineTo(tip[0] - tg[0] * 4 + sd[0] * 12, tip[1] - tg[1] * 4 + sd[1] * 12);
    ctx.lineTo(tip[0] - tg[0] * 4 - sd[0] * 12, tip[1] - tg[1] * 4 - sd[1] * 12);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawPauseIcon(r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    circle(cx, cy, 30, 'rgba(255,255,255,0.08)');
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const x of [-7, 7]) { ctx.moveTo(cx + x, cy - 11); ctx.lineTo(cx + x, cy + 11); }
    ctx.stroke();
  }

  function drawInfoIcon(r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, col = 'rgba(255,255,255,0.75)';
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, 17, 0, TAU); ctx.stroke();
    circle(cx, cy - 8, 2.8, col);
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, cy - 2); ctx.lineTo(cx, cy + 9); ctx.stroke();
  }

  // A cog: eight teeth around a ring.
  function drawSettingsIcon(r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, col = 'rgba(255,255,255,0.75)';
    ctx.strokeStyle = col; ctx.lineWidth = 7; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * TAU / 8;
      ctx.moveTo(cx + Math.cos(a) * 10, cy + Math.sin(a) * 10); ctx.lineTo(cx + Math.cos(a) * 19, cy + Math.sin(a) * 19);
    }
    ctx.stroke();
    circle(cx, cy, 14, col);
    circle(cx, cy, 6, rgba(BG_TOP));
  }

  // Two beamed eighth notes, crossed out when the music is off.
  function drawMusicIcon(r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, col = 'rgba(255,255,255,0.75)';
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    for (const x of [-9, 9]) {
      circle(cx + x - 4, cy + 10, 5.5, col);
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx + x + 1, cy + 10); ctx.lineTo(cx + x + 1, cy - 12); ctx.stroke();
    }
    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx - 8, cy - 12); ctx.lineTo(cx + 10, cy - 15); ctx.stroke();
    if (music.muted) {
      ctx.beginPath(); ctx.moveTo(cx - 20, cy - 18); ctx.lineTo(cx + 20, cy + 18);
      ctx.strokeStyle = rgba(BG_BOTTOM, 0.9); ctx.lineWidth = 7; ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    }
  }

  function drawSoundIcon(r) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, col = 'rgba(255,255,255,0.75)';
    ctx.fillStyle = ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    [[-16, -6], [-8, -6], [2, -15], [2, 15], [-8, 6], [-16, 6]].forEach(([x, y], i) =>
      i ? ctx.lineTo(cx + x, cy + y) : ctx.moveTo(cx + x, cy + y));
    ctx.closePath(); ctx.fill();
    if (sfx.muted) {
      ctx.beginPath(); ctx.moveTo(cx + 8, cy - 7); ctx.lineTo(cx + 20, cy + 7);
      ctx.moveTo(cx + 8, cy + 7); ctx.lineTo(cx + 20, cy - 7); ctx.stroke();
    } else {
      for (const rad of [9, 16]) { ctx.beginPath(); ctx.arc(cx + 2, cy, rad, -Math.PI / 3, Math.PI / 3); ctx.stroke(); }
    }
  }

  function drawLeaderboard() {
    ctx.fillStyle = rgba(BG_BOTTOM, 0.85); ctx.fillRect(0, 0, W, H);
    centered(tr('leaderboard'), H * 0.1, 60, WHITE);
    const local = board.status === 'local', global = board.status === 'global';
    centered(tr(local ? 'top_local' : global ? 'top_world' : 'top_online'),
      H * 0.1 + 40, 20, WHITE, 0.5);
    if (board.status === 'loading') centered(tr('loading'), H * 0.4, 24, WHITE, 0.6);
    else if (!board.rows.length) centered(tr('no_scores'), H * 0.4, 24, WHITE, 0.6);
    const y0 = H * 0.17, w = W - 80;
    const row = (y, rank, r, mine) => {
      ctx.fillStyle = mine ? rgba(PALETTE[2], 0.16) : 'rgba(255,255,255,0.05)';
      roundRect({ x: 40, y, w, h: 56 }, 14); ctx.fill();
      circle(76, y + 28, 18, rgba(PALETTE[(rank - 1) % PALETTE.length]));
      ctx.font = `800 ${rank < 100 ? 22 : rank < 1000 ? 16 : 12}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(INK); ctx.fillText(String(rank), 76, y + 29);
      // Local games saved before names existed, or left unnamed, show their date.
      let name = local ? r.name || r.date : (global ? r.name : board.names[r.id]) || tr('player');
      if (mine && !local) name += tr('you');
      ctx.font = `800 24px ${FONT}`;
      while (name.length > 3 && ctx.measureText(name).width > w - 250) name = name.slice(0, -2) + '…';
      text(112, y + 37, name, 24, WHITE);
      text(40 + w - 120, y + 36, tr('row_level', r.level), 18, WHITE, 0.45, 'right');
      text(40 + w - 22, y + 39, String(r.score), 30, WHITE, 1, 'right');
    };
    board.rows.forEach((r, i) => row(y0 + i * 66, i + 1, r,
      local ? i === board.localHighlight : global ? r.mine : r.id === board.myId));
    // Outside the global top 10: the player's own place, under the list.
    if (global && board.me && board.me.rank > board.rows.length) {
      const y = y0 + board.rows.length * 66 + 10;
      centered('···', y + 4, 24, WHITE, 0.4);
      row(y + 20, board.me.rank, board.me, true);
    }
    if (board.status === 'ready' && !board.myId) centered(tr('sign_in'), H * 0.84, 20, WHITE, 0.5);
    centered(tr('tap_back'), H * 0.9, 22, WHITE, 0.5);
  }

  function drawAbout() {
    ctx.fillStyle = rgba(BG_BOTTOM, 0.85); ctx.fillRect(0, 0, W, H);
    centered('COLOR SPIN', H * 0.1, 60, WHITE);
    centered(tr('version', VERSION), H * 0.1 + 40, 20, WHITE, 0.5);
    let y = H * 0.2;
    for (const [title, lines] of TEXT[lang].about) {
      centered(title, y, 26, PALETTE[2]);
      y += 44;
      for (const line of lines) { centered(line, y, 22, WHITE, 0.8); y += 34; }
      y += 30;
    }
    // The site link, right under the credits: underlined, and tappable.
    y -= 30;
    ctx.font = `800 24px ${FONT}`;
    const w = ctx.measureText(SITE_LABEL).width;
    centered(SITE_LABEL, y, 24, PALETTE[1]);
    ctx.fillStyle = rgba(PALETTE[1]); ctx.fillRect((W - w) / 2, y + 5, w, 2);
    linkRect = { x: (W - w) / 2 - 20, y: y - 34, w: w + 40, h: 56 };
    centered(tr('tap_back'), H * 0.9, 22, WHITE, 0.5);
  }

  function drawSettings() {
    ctx.fillStyle = rgba(BG_BOTTOM, 0.85); ctx.fillRect(0, 0, W, H);
    centered(tr('settings'), H * 0.2, 60, WHITE);
    const rows = settingsButtons();
    const values = [
      [tr('music'), music.muted ? tr('off') : tr('on')],
      [tr('sounds'), sfx.muted ? tr('off') : tr('on')],
      [tr('language'), tr('lang_name')],
    ];
    values.forEach(([k, v], i) => button(rows[i], `${k}:  ${v}`, WHITE, 0.1, WHITE));
    button(rows[3], tr('back'), PALETTE[2], 1, INK);
  }

  function drawPlay() {
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = rgba(PALETTE[2]);
    ctx.fillRect(0, 0, W * (score % POINTS_PER_LEVEL) / POINTS_PER_LEVEL, 6);

    text(28, 84, String(score), 56 + 18 * scorePop, WHITE);
    text(30, 118, tr('hud_level', level), 20, WHITE, 0.55);
    for (let i = 0; i < MAX_LIVES; i++) {
      const x = W - 36 - i * 34, y = 56;
      if (i < lives) {
        circle(x, y, 17, rgba(PALETTE[0], 0.2));
        circle(x, y, 11, rgba(PALETTE[0]));
        circle(x - 3, y - 3, 3.5, 'rgba(255,255,255,0.5)');
      } else {
        ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    if (state === STATE.PLAYING) {
      drawPauseIcon(pauseButton());
      drawTurnArrow(96, H - 110, -1, 0.12 + 0.6 * arrowFlash[0]);
      drawTurnArrow(W - 96, H - 110, 1, 0.12 + 0.6 * arrowFlash[1]);
    }
    if (bannerTime > 0 && state === STATE.PLAYING) {
      const a = clamp(bannerTime / 0.4, 0, 1), grow = clamp((1.2 - bannerTime) / 0.15, 0, 1);
      centered(banner, H * 0.22, lerp(36, 52, grow), WHITE, a);
    }
  }

  function drawPause() {
    if (resumeTimer > 0) {
      // Countdown over the frozen board, so the player can see what's coming.
      const n = Math.ceil(resumeTimer / RESUME_BEAT), k = (resumeTimer % RESUME_BEAT) / RESUME_BEAT;
      ctx.fillStyle = rgba(BG_BOTTOM, 0.35); ctx.fillRect(0, 0, W, H);
      centered(String(n), H * 0.22 + 20, lerp(90, 130, k), WHITE, clamp(k * 2, 0, 1));
      return;
    }
    const t = clamp(pauseTime * 5, 0, 1);
    ctx.fillStyle = rgba(BG_BOTTOM, 0.8 * t); ctx.fillRect(0, 0, W, H);
    const slide = (1 - t) * 30;
    centered(tr('paused'), H * 0.3 + slide, 68, WHITE, t);
    centered(tr('pause_stats', score, level), H * 0.3 + 48 + slide, 22, WHITE, 0.55 * t);
    const b = pauseButtons();
    button(b[0], tr('resume'), PALETTE[2], 1, INK);
    button(b[1], tr('menu'), WHITE, 0.1, WHITE);
    const audio = pauseAudioButtons();
    drawMusicIcon(audio[0]);
    drawSoundIcon(audio[1]);
  }

  function drawGameOver() {
    const t = clamp(gameOverTime * 3, 0, 1);
    ctx.fillStyle = rgba(BG_BOTTOM, 0.8 * t); ctx.fillRect(0, 0, W, H);
    const slide = (1 - t) * 40;
    centered(tr('game_over'), H * 0.27 + slide, 68, PALETTE[0], t);
    centered(String(score), H * 0.41 + slide, 130, WHITE, t);
    centered(tr('points_level', level), H * 0.41 + 44 + slide, 22, WHITE, 0.55 * t);
    if (newBest) centered(tr('new_best'), H * 0.52 + slide, 34 + Math.sin(time * 6) * 3, PALETTE[2], t);
    else centered(tr('best', best), H * 0.52 + slide, 26, WHITE, 0.6 * t);
    if (lastRank > 0) centered(tr('rank', lastRank), H * 0.52 + 44 + slide, 22, WHITE, 0.7 * t);
    else if (score > 0 && board.status === 'ready' && !board.myId)
      centered(tr('sign_in'), H * 0.52 + 44 + slide, 20, WHITE, 0.5 * t);
    if (nameShown) placeNameInput(t);
    if (gameOverTime > 0.6) {
      const b = gameOverButtons();
      button(b[0], tr('replay'), PALETTE[2], 1, INK);
      button(b[1], tr('menu'), WHITE, 0.1, WHITE);
    }
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawBackground();
    drawBalls();
    shape.draw(worldX, worldY);
    drawFx(worldX, worldY);
    if (state === STATE.MENU) drawMenu();
    else if (state === STATE.LEADERBOARD) drawLeaderboard();
    else if (state === STATE.ABOUT) drawAbout();
    else if (state === STATE.SETTINGS) drawSettings();
    else {
      drawPlay();
      if (state === STATE.PAUSED) drawPause();
      else if (state === STATE.GAME_OVER) drawGameOver();
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,51,51,${0.22 * flash})`; ctx.fillRect(0, 0, W, H); }
    if (fade > 0) { ctx.fillStyle = rgba(BG_BOTTOM, fade); ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function frame(now) {
    // Clamp the step so a hidden tab or a hiccup doesn't teleport the balls.
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  applyLanguage();
  goToMenu();
  requestAnimationFrame(frame);
  initBoard();
})();
</script>
